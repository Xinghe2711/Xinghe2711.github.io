<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>欢迎来到一架国泰航空A330官方网站</title>
    <style>
        :root {
            --bg: #ffffff;
            --default-bg-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600&q=80');
            --text: #1a1a1a;
            --text-secondary: #888888;
            --divider: #dddddd;
            --menu-bg: #ffffff;
            --menu-shadow: rgba(0,0,0,0.12);
            --menu-item-hover: #f0f0f0;
            --accent: #0077cc;
            --accent-hover: #005fa3;
            --btn-primary: #0077cc;
            --btn-primary-hover: #005fa3;
            --btn-primary-text: #ffffff;
            --download-btn-bg: #ffffff;
            --download-btn-border: #1a1a1a;
            --download-btn-text: #1a1a1a;
            --download-btn-hover-bg: #0077cc;
            --download-btn-hover-text: #ffffff;
            --announcement-bg: #ffffff;
            --announcement-border: #1a1a1a;
            --announcement-title: #1a1a1a;
            --announcement-subtitle: #888888;
            --modal-bg: #ffffff;
            --modal-overlay: rgba(0,0,0,0.4);
            --dial-key-bg: #f0f0f0;
            --dial-key-hover: #e0e0e0;
            --dial-display-bg: #f8f8f8;
            --dial-display-text: #1a1a1a;
            --sidebar-width: 300px;
            --topbar-height: 60px;
        }

        [data-theme="dark"] {
            --bg: #121212;
            --default-bg-image: none;
            --text: #f0f0f0;
            --text-secondary: #888888;
            --divider: #3a3a3a;
            --menu-bg: #1e1e1e;
            --menu-shadow: rgba(0,0,0,0.6);
            --menu-item-hover: #2a2a2a;
            --accent: #42a5f5;
            --accent-hover: #64b5f6;
            --btn-primary: #42a5f5;
            --btn-primary-hover: #64b5f6;
            --btn-primary-text: #121212;
            --download-btn-bg: #1e1e1e;
            --download-btn-border: #f0f0f0;
            --download-btn-text: #f0f0f0;
            --download-btn-hover-bg: #42a5f5;
            --download-btn-hover-text: #121212;
            --announcement-bg: #1e1e1e;
            --announcement-border: #f0f0f0;
            --announcement-title: #f0f0f0;
            --announcement-subtitle: #888888;
            --modal-bg: #1e1e1e;
            --modal-overlay: rgba(0,0,0,0.6);
            --dial-key-bg: #2a2a2a;
            --dial-key-hover: #3a3a3a;
            --dial-display-bg: #171717;
            --dial-display-text: #f0f0f0;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            background-color: var(--bg);
            background-image: var(--default-bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            padding-top: calc(var(--topbar-height) + 1rem);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* ========== 顶部栏 ========== */
        .top-bar {
            position: fixed; top:0; left:0; right:0;
            height: var(--topbar-height);
            background-color: var(--bg);
            border-bottom: 1px solid var(--divider);
            z-index: 1003;
            display: flex; align-items: center; padding: 0 20px;
            transition: all 0.3s ease;
        }
        .site-title { font-size:1.05rem; font-weight:400; color:var(--text); letter-spacing:0.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

        /* ========== 汉堡按钮 ========== */
        .hamburger-btn { position:fixed; top:calc((var(--topbar-height) - 44px)/2); right:20px; z-index:1004; background:transparent; border:none; cursor:pointer; padding:10px; border-radius:50%; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:5px; width:44px; height:44px; -webkit-tap-highlight-color:transparent; outline:none; }
        .hamburger-line { display:block; width:22px; height:2.5px; background-color:var(--accent); border-radius:4px; transition:all 0.4s cubic-bezier(0.68,-0.55,0.27,1.55); }
        .hamburger-btn.active .hamburger-line:nth-child(1) { transform:translateY(7.5px) rotate(45deg); }
        .hamburger-btn.active .hamburger-line:nth-child(2) { opacity:0; }
        .hamburger-btn.active .hamburger-line:nth-child(3) { transform:translateY(-7.5px) rotate(-45deg); }

        /* ========== 遮罩 ========== */
        .menu-overlay { position:fixed; inset:0; background-color:var(--modal-overlay); z-index:1000; opacity:0; pointer-events:none; transition:opacity 0.3s; }
        .menu-overlay.visible { opacity:1; pointer-events:auto; }

        /* ========== 侧边栏 ========== */
        .sidebar-menu { position:fixed; top:0; right:0; z-index:1001; background-color:var(--menu-bg); width:var(--sidebar-width); max-width:85vw; height:100%; box-shadow:-4px 0 24px var(--menu-shadow); padding:20px 0; overflow-y:auto; transform:translateX(100%); transition:transform 0.35s cubic-bezier(0.22,1,0.36,1); border-left:1px solid var(--divider); }
        .sidebar-menu.open { transform:translateX(0); }
        .menu-section { padding:14px 20px 6px; font-size:0.7rem; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-secondary); }
        .menu-item { display:flex; align-items:center; justify-content:space-between; width:100%; padding:11px 20px; background:transparent; border:none; cursor:pointer; font-size:0.95rem; color:var(--text); transition:background-color 0.2s; font-family:inherit; letter-spacing:0.04em; -webkit-tap-highlight-color:transparent; outline:none; text-decoration:none; text-align:left; }
        .menu-item:hover { background-color:var(--menu-item-hover); }
        .menu-divider { height:1px; background-color:var(--divider); margin:6px 0; opacity:0.5; }

        /* ========== 主容器 ========== */
        .container { text-align:center; padding:clamp(1.2rem,4vw,2rem); max-width:540px; width:100%; margin:auto; transition:all 0.35s ease; }
        h1 { font-size:clamp(1.3rem,4vw,2rem); font-weight:300; color:var(--text); letter-spacing:0.04em; line-height:1.5; margin-bottom:1.2rem; }
        .divider { width:48px; height:1px; background-color:var(--divider); margin:0 auto 1.2rem auto; }
        .button-group { display:flex; flex-wrap:wrap; justify-content:center; gap:0.7rem; }
        .btn { display:inline-block; padding:0.65rem 1.8rem; font-size:0.9rem; color:var(--btn-primary-text); background-color:var(--btn-primary); border:1px solid var(--btn-primary); border-radius:50px; cursor:pointer; text-decoration:none; letter-spacing:0.05em; transition:all 0.3s; -webkit-tap-highlight-color:transparent; white-space:nowrap; }
        .btn:hover { background-color:var(--btn-primary-hover); border-color:var(--btn-primary-hover); }
        .announcement { margin:1.2rem auto; max-width:360px; padding:0.7rem 1rem; border:1.5px solid var(--announcement-border); border-radius:10px; background-color:var(--announcement-bg); }
        .announcement-title { font-size:1.1rem; font-weight:500; color:var(--announcement-title); }
        .announcement-subtitle { font-size:0.7rem; color:var(--announcement-subtitle); }
        .download-group { display:flex; flex-direction:column; align-items:center; gap:0.6rem; margin-top:1.2rem; }
        .btn-download { display:block; width:100%; max-width:340px; padding:0.7rem 1rem; font-size:0.85rem; text-align:center; color:var(--download-btn-text); background-color:var(--download-btn-bg); border:1.5px solid var(--download-btn-border); border-radius:8px; cursor:pointer; text-decoration:none; transition:all 0.3s; -webkit-tap-highlight-color:transparent; }
        .btn-download:hover { background-color:var(--download-btn-hover-bg); border-color:var(--download-btn-hover-bg); color:var(--download-btn-hover-text); }
        .footer-note { margin-top:1.5rem; font-size:0.6rem; color:var(--text-secondary); letter-spacing:0.12em; text-transform:uppercase; }

        /* ========== 设置弹窗 ========== */
        .settings-overlay { position:fixed; inset:0; background-color:var(--modal-overlay); z-index:2100; display:flex; justify-content:center; align-items:center; opacity:0; pointer-events:none; transition:opacity 0.3s; padding:1rem; visibility:hidden; }
        .settings-overlay.visible { opacity:1; pointer-events:auto; visibility:visible; }
        .settings-modal { background-color:var(--modal-bg); border-radius:18px; padding:1.2rem; width:100%; max-width:340px; max-height:78vh; overflow-y:auto; box-shadow:0 12px 48px rgba(0,0,0,0.2); transform:translateY(16px) scale(0.96); transition:all 0.3s cubic-bezier(0.22,1,0.36,1); border:1px solid var(--divider); }
        .settings-overlay.visible .settings-modal { transform:translateY(0) scale(1); }
        .settings-title { font-size:1.2rem; font-weight:600; color:var(--text); margin-bottom:0.8rem; text-align:center; }
        .settings-section { margin-bottom:0.7rem; }
        .settings-section-title { font-size:0.7rem; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-secondary); margin-bottom:0.3rem; }
        .settings-option { display:flex; align-items:center; justify-content:space-between; padding:0.4rem 0; border-bottom:1px solid var(--divider); }
        .settings-option:last-child { border-bottom:none; }
        .settings-option-label { font-size:0.85rem; color:var(--text); }
        .settings-btn { padding:0.35rem 0.9rem; font-size:0.75rem; border-radius:16px; border:1px solid var(--divider); background-color:transparent; color:var(--text); cursor:pointer; transition:all 0.2s; -webkit-tap-highlight-color:transparent; outline:none; }
        .settings-btn.active { background-color:var(--accent); border-color:var(--accent); color:#fff; }
        .settings-close-btn { display:block; width:100%; margin-top:0.8rem; padding:0.55rem; background-color:var(--accent); color:#fff; border:none; border-radius:10px; font-size:0.85rem; cursor:pointer; }

        /* ========== 拨号盘 ========== */
        .dialpad-overlay { position:fixed; inset:0; background-color:var(--modal-overlay); z-index:2000; display:flex; justify-content:center; align-items:center; opacity:0; pointer-events:none; transition:opacity 0.3s; padding:1rem; visibility:hidden; }
        .dialpad-overlay.visible { opacity:1; pointer-events:auto; visibility:visible; }
        .dialpad-modal { background-color:var(--modal-bg); border-radius:16px; padding:1rem; width:100%; max-width:280px; box-shadow:0 10px 40px rgba(0,0,0,0.2); transform:translateY(16px) scale(0.96); transition:all 0.3s cubic-bezier(0.22,1,0.36,1); border:1px solid var(--divider); }
        .dialpad-overlay.visible .dialpad-modal { transform:translateY(0) scale(1); }
        .dialpad-display { background-color:var(--dial-display-bg); border-radius:8px; padding:0.5rem 0.7rem; font-size:1.2rem; text-align:right; color:var(--dial-display-text); margin-bottom:0.7rem; min-height:40px; display:flex; align-items:center; justify-content:flex-end; overflow-x:auto; }
        .dialpad-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:0.4rem; }
        .dial-key { background-color:var(--dial-key-bg); border:none; border-radius:50%; aspect-ratio:1; display:flex; flex-direction:column; justify-content:center; align-items:center; cursor:pointer; font-size:1rem; color:var(--text); transition:all 0.2s; -webkit-tap-highlight-color:transparent; outline:none; font-family:inherit; }
        .dial-key:hover { background-color:var(--dial-key-hover); }
        .dial-key .sub { font-size:0.45rem; color:var(--text-secondary); margin-top:1px; }
        .dial-actions { display:flex; gap:0.4rem; margin-top:0.5rem; }
        .dial-action { flex:1; padding:0.5rem 0; border:none; border-radius:30px; cursor:pointer; font-size:0.75rem; -webkit-tap-highlight-color:transparent; font-family:inherit; }
        .dial-action.delete { background-color:transparent; color:var(--text-secondary); border:1px solid var(--divider); }
        .dial-action.close { background-color:var(--accent); color:#fff; }

        /* ========== 透明模式 iOS16 ========== */
        body.glass-mode { background-color:rgba(255,255,255,0.35); }
        [data-theme="dark"] body.glass-mode { background-color:rgba(18,18,18,0.35); }
        body.glass-mode .top-bar { background-color:rgba(255,255,255,0.75); backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%); border-bottom:1px solid rgba(255,255,255,0.5); }
        [data-theme="dark"] body.glass-mode .top-bar { background-color:rgba(28,28,30,0.75); backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%); border-bottom:1px solid rgba(255,255,255,0.1); }
        body.glass-mode .container { background-color:rgba(255,255,255,0.72); backdrop-filter:blur(22px) saturate(190%); -webkit-backdrop-filter:blur(22px) saturate(190%); border-radius:22px; border:1px solid rgba(255,255,255,0.6); box-shadow:0 6px 28px rgba(0,0,0,0.07), inset 0 1px 0 rgba(255,255,255,0.65); }
        [data-theme="dark"] body.glass-mode .container { background-color:rgba(44,44,46,0.72); backdrop-filter:blur(22px) saturate(190%); -webkit-backdrop-filter:blur(22px) saturate(190%); border:1px solid rgba(255,255,255,0.1); }
        body.glass-mode .sidebar-menu { background-color:rgba(255,255,255,0.72); backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%); border-left:1px solid rgba(255,255,255,0.5); }
        [data-theme="dark"] body.glass-mode .sidebar-menu { background-color:rgba(28,28,30,0.72); backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%); border-left:1px solid rgba(255,255,255,0.1); }
        body.glass-mode .btn { background-color:rgba(0,122,255,0.8); border-color:rgba(255,255,255,0.35); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
        body.glass-mode .btn-download { background-color:rgba(255,255,255,0.55); border-color:rgba(0,0,0,0.18); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
        [data-theme="dark"] body.glass-mode .btn-download { background-color:rgba(44,44,46,0.55); border-color:rgba(255,255,255,0.12); color:#f0f0f0; }
        body.glass-mode .announcement { background-color:rgba(255,255,255,0.55); border-color:rgba(0,0,0,0.18); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
        [data-theme="dark"] body.glass-mode .announcement { background-color:rgba(44,44,46,0.55); border-color:rgba(255,255,255,0.12); }
        body.glass-mode .settings-modal { background-color:rgba(255,255,255,0.72); backdrop-filter:blur(22px) saturate(190%); -webkit-backdrop-filter:blur(22px) saturate(190%); border:1px solid rgba(255,255,255,0.6); }
        [data-theme="dark"] body.glass-mode .settings-modal { background-color:rgba(28,28,30,0.72); backdrop-filter:blur(22px) saturate(190%); -webkit-backdrop-filter:blur(22px) saturate(190%); border:1px solid rgba(255,255,255,0.1); }
        body.glass-mode .dialpad-modal { background-color:rgba(255,255,255,0.72); backdrop-filter:blur(22px) saturate(190%); -webkit-backdrop-filter:blur(22px) saturate(190%); border:1px solid rgba(255,255,255,0.55); }
        [data-theme="dark"] body.glass-mode .dialpad-modal { background-color:rgba(28,28,30,0.72); backdrop-filter:blur(22px) saturate(190%); -webkit-backdrop-filter:blur(22px) saturate(190%); border:1px solid rgba(255,255,255,0.1); }

        /* ========== 液态玻璃 iOS26 ========== */
        body.liquid-glass-mode { background-color:rgba(255,255,255,0.2); }
        [data-theme="dark"] body.liquid-glass-mode { background-color:rgba(18,18,18,0.2); }
        body.liquid-glass-mode .top-bar { background:linear-gradient(180deg, rgba(255,255,255,0.4), rgba(255,255,255,0.15)); backdrop-filter:blur(28px) saturate(200%); -webkit-backdrop-filter:blur(28px) saturate(200%); border-bottom:1px solid rgba(255,255,255,0.4); }
        [data-theme="dark"] body.liquid-glass-mode .top-bar { background:linear-gradient(180deg, rgba(50,50,50,0.4), rgba(20,20,20,0.2)); border-bottom:1px solid rgba(255,255,255,0.1); }
        body.liquid-glass-mode .container { background:linear-gradient(135deg, rgba(255,255,255,0.4), rgba(255,255,255,0.12) 35%, rgba(255,255,255,0.25) 65%, rgba(255,255,255,0.45)); backdrop-filter:blur(28px) saturate(210%); -webkit-backdrop-filter:blur(28px) saturate(210%); border-radius:26px; border:1px solid rgba(255,255,255,0.4); box-shadow:0 0 0 1px rgba(255,255,255,0.2), 0 10px 40px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.45); }
        [data-theme="dark"] body.liquid-glass-mode .container { background:linear-gradient(135deg, rgba(55,55,55,0.4), rgba(25,25,25,0.15) 35%, rgba(40,40,40,0.3) 65%, rgba(55,55,55,0.45)); border:1px solid rgba(255,255,255,0.12); }
        body.liquid-glass-mode .sidebar-menu { background:linear-gradient(180deg, rgba(255,255,255,0.4), rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.3)); backdrop-filter:blur(28px) saturate(200%); -webkit-backdrop-filter:blur(28px) saturate(200%); border-left:1px solid rgba(255,255,255,0.35); }
        [data-theme="dark"] body.liquid-glass-mode .sidebar-menu { background:linear-gradient(180deg, rgba(45,45,45,0.4), rgba(20,20,20,0.2) 50%, rgba(35,35,35,0.35)); border-left:1px solid rgba(255,255,255,0.1); }
        body.liquid-glass-mode .btn { background:linear-gradient(135deg, rgba(0,119,204,0.65), rgba(0,119,204,0.35) 50%, rgba(0,119,204,0.55)); backdrop-filter:blur(10px) saturate(150%); -webkit-backdrop-filter:blur(10px) saturate(150%); border:1px solid rgba(255,255,255,0.3); color:#fff; }
        [data-theme="dark"] body.liquid-glass-mode .btn { background:linear-gradient(135deg, rgba(66,165,245,0.65), rgba(66,165,245,0.35) 50%, rgba(66,165,245,0.55)); color:#121212; }
        body.liquid-glass-mode .btn-download { background:linear-gradient(135deg, rgba(255,255,255,0.5), rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.35)); backdrop-filter:blur(10px) saturate(140%); -webkit-backdrop-filter:blur(10px) saturate(140%); border:1px solid rgba(0,0,0,0.15); }
        [data-theme="dark"] body.liquid-glass-mode .btn-download { background:linear-gradient(135deg, rgba(45,45,45,0.5), rgba(20,20,20,0.25) 50%, rgba(35,35,35,0.4)); border-color:rgba(255,255,255,0.1); color:#f0f0f0; }
        body.liquid-glass-mode .announcement { background:linear-gradient(135deg, rgba(255,255,255,0.45), rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.3)); backdrop-filter:blur(20px) saturate(170%); -webkit-backdrop-filter:blur(20px) saturate(170%); border:1px solid rgba(255,255,255,0.35); }
        [data-theme="dark"] body.liquid-glass-mode .announcement { background:linear-gradient(135deg, rgba(45,45,45,0.45), rgba(20,20,20,0.2) 50%, rgba(35,35,35,0.35)); border-color:rgba(255,255,255,0.1); }
        body.liquid-glass-mode .settings-modal { background:linear-gradient(135deg, rgba(255,255,255,0.45), rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.3)); backdrop-filter:blur(28px) saturate(200%); -webkit-backdrop-filter:blur(28px) saturate(200%); border:1px solid rgba(255,255,255,0.4); }
        [data-theme="dark"] body.liquid-glass-mode .settings-modal { background:linear-gradient(135deg, rgba(45,45,45,0.45), rgba(20,20,20,0.2) 50%, rgba(35,35,35,0.35)); border:1px solid rgba(255,255,255,0.12); }
        body.liquid-glass-mode .dialpad-modal { background:linear-gradient(135deg, rgba(255,255,255,0.5), rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.38)); backdrop-filter:blur(28px) saturate(190%); -webkit-backdrop-filter:blur(28px) saturate(190%); border:1px solid rgba(255,255,255,0.45); }
        [data-theme="dark"] body.liquid-glass-mode .dialpad-modal { background:linear-gradient(135deg, rgba(50,50,50,0.5), rgba(22,22,22,0.25) 50%, rgba(40,40,40,0.4)); border:1px solid rgba(255,255,255,0.12); }

        /* ========== 怀旧模式 iOS6 ========== */
        body.retro-mode { background-color:#a0a8b0; background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="%23b8c0c8"/></svg>'); background-size:160px 160px; }
        [data-theme="dark"] body.retro-mode { background-color:#2a2f35; background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="%233a4048"/></svg>'); }
        body.retro-mode .top-bar { background:linear-gradient(to bottom,#f0f0f0,#c8c8c8); border-bottom:1px solid #7f7f7f; box-shadow:0 2px 6px rgba(0,0,0,0.35); }
        [data-theme="dark"] body.retro-mode .top-bar { background:linear-gradient(to bottom,#555,#3a3a3a); border-bottom:1px solid #1a1a1a; }
        body.retro-mode .site-title { font-weight:bold; color:#333; text-shadow:0 1px 0 rgba(255,255,255,0.7); }
        [data-theme="dark"] body.retro-mode .site-title { color:#eee; text-shadow:0 1px 0 rgba(0,0,0,0.7); }

    <script>
        (function() {
            const $ = id => document.getElementById(id);
            const hamburgerBtn = $('hamburgerBtn'), sidebarMenu = $('sidebarMenu'), menuOverlay = $('menuOverlay');
            const settingsTrigger = $('settingsTrigger'), settingsOverlay = $('settingsOverlay'), settingsCloseBtn = $('settingsCloseBtn');
            const themeLightBtn = $('themeLightBtn'), themeDarkBtn = $('themeDarkBtn');
            const glassModeBtn = $('glassModeBtn'), liquidGlassModeBtn = $('liquidGlassModeBtn'), retroModeBtn = $('retroModeBtn'), bingWallpaperBtn = $('bingWallpaperBtn');
            const langButtons = document.querySelectorAll('.lang-btn');
            const mainTitle = $('mainTitle'), siteTitle = document.querySelector('.site-title');
            const dialpadOverlay = $('dialpadOverlay'), dialpadDisplay = $('dialpadDisplay'), dialpadGrid = $('dialpadGrid');
            const dialDelete = $('dialDelete'), dialClose = $('dialClose'), dialpadTrigger = $('dialpadTrigger');
            const htmlElement = document.documentElement;

            let isMenuOpen = false;
            let currentTheme = localStorage.getItem('theme') || 'light';
            let currentLang = localStorage.getItem('lang') || 'zh-CN';
            let bingEnabled = localStorage.getItem('bingWallpaper') === 'enabled';
            let glassEnabled = localStorage.getItem('glassMode') === 'enabled';
            let liquidGlassEnabled = localStorage.getItem('liquidGlassMode') === 'enabled';
            let retroEnabled = localStorage.getItem('retroMode') === 'enabled';
            let dialValue = '';

            const translations = {
                'zh-CN': { siteTitle:'一架国泰航空A330官方网站', settings:'设置', theme:'主题模式', light:'浅色', dark:'深色', displayMode:'显示模式', glassMode:'透明模式', liquidGlassMode:'液态玻璃', bingWallpaper:'必应壁纸', retroMode:'怀旧模式', language:'语言', links:'链接', menu:'菜单', bilibili:'我的 bilibili', fanGroup:'加入粉丝群', announcementTitle:'公告栏', announcementSubtitle:'支持多语言', footer:'Cathay Pacific • A330 • Minimal', titleHtml:'欢迎来到<br>一架国泰航空A330官方网站', close:'关闭', delete:'删除' },
                'zh-TW': { siteTitle:'一架國泰航空A330官方網站', settings:'設置', theme:'主題模式', light:'淺色', dark:'深色', displayMode:'顯示模式', glassMode:'透明模式', liquidGlassMode:'液態玻璃', bingWallpaper:'必應壁紙', retroMode:'懷舊模式', language:'語言', links:'連結', menu:'菜單', bilibili:'我的 bilibili', fanGroup:'加入粉絲群', announcementTitle:'公告欄', announcementSubtitle:'支援多語言', footer:'Cathay Pacific • A330 • Minimal', titleHtml:'歡迎來到<br>一架國泰航空A330官方網站', close:'關閉', delete:'刪除' },
                'ja': { siteTitle:'キャセイパシフィックA330公式サイト', settings:'設定', theme:'テーマ', light:'ライト', dark:'ダーク', displayMode:'表示モード', glassMode:'グラスモード', liquidGlassMode:'リキッドグラス', bingWallpaper:'Bing壁紙', retroMode:'レトロモード', language:'言語', links:'リンク', menu:'メニュー', bilibili:'My bilibili', fanGroup:'ファングループ', announcementTitle:'お知らせ', announcementSubtitle:'多言語対応', footer:'Cathay Pacific • A330', titleHtml:'ようこそ<br>A330公式サイトへ', close:'閉じる', delete:'削除' },
                'en-GB': { siteTitle:'Cathay Pacific A330 Official', settings:'Settings', theme:'Theme', light:'Light', dark:'Dark', displayMode:'Display', glassMode:'Glass Mode', liquidGlassMode:'Liquid Glass', bingWallpaper:'Bing Wallpaper', retroMode:'Retro Mode', language:'Language', links:'Links', menu:'Menu', bilibili:'My bilibili', fanGroup:'Join Fan Group', announcementTitle:'Announcement', announcementSubtitle:'Multi-language', footer:'Cathay Pacific • A330', titleHtml:'Welcome to<br>A330 Official', close:'Close', delete:'Delete' },
                'en-US': { siteTitle:'Cathay Pacific A330 Official', settings:'Settings', theme:'Theme', light:'Light', dark:'Dark', displayMode:'Display', glassMode:'Glass Mode', liquidGlassMode:'Liquid Glass', bingWallpaper:'Bing Wallpaper', retroMode:'Retro Mode', language:'Language', links:'Links', menu:'Menu', bilibili:'My bilibili', fanGroup:'Join Fan Group', announcementTitle:'Announcement', announcementSubtitle:'Multi-language', footer:'Cathay Pacific • A330', titleHtml:'Welcome to<br>A330 Official', close:'Close', delete:'Delete' },
                'ko': { siteTitle:'캐세이퍼시픽 A330 공식', settings:'설정', theme:'테마', light:'라이트', dark:'다크', displayMode:'디스플레이', glassMode:'글래스', liquidGlassMode:'리퀴드', bingWallpaper:'Bing 배경', retroMode:'레트로', language:'언어', links:'링크', menu:'메뉴', bilibili:'My bilibili', fanGroup:'팬그룹', announcementTitle:'공지', announcementSubtitle:'다국어', footer:'Cathay Pacific', titleHtml:'환영합니다<br>A330 공식', close:'닫기', delete:'삭제' }
            };

            const dialKeys = [
                { digit:'1', sub:'' }, { digit:'2', sub:'ABC' }, { digit:'3', sub:'DEF' },
                { digit:'4', sub:'GHI' }, { digit:'5', sub:'JKL' }, { digit:'6', sub:'MNO' },
                { digit:'7', sub:'PQRS' }, { digit:'8', sub:'TUV' }, { digit:'9', sub:'WXYZ' },
                { digit:'*', sub:'' }, { digit:'0', sub:'+' }, { digit:'#', sub:'' },
            ];

            function buildDialpad() {
                dialKeys.forEach(key => {
                    const btn = document.createElement('button');
                    btn.className = 'dial-key';
                    btn.innerHTML = key.digit + (key.sub ? `<span class="sub">${key.sub}</span>` : '');
                    btn.addEventListener('click', () => { dialValue += key.digit; dialpadDisplay.textContent = dialValue; });
                    dialpadGrid.appendChild(btn);
                });
            }

            function updateUI() {
                // 应用模式类
                document.body.classList.remove('glass-mode','liquid-glass-mode','retro-mode');
                if (retroEnabled) document.body.classList.add('retro-mode');
                else if (liquidGlassEnabled) document.body.classList.add('liquid-glass-mode');
                else if (glassEnabled) document.body.classList.add('glass-mode');
                // 更新按钮状态
                glassModeBtn.classList.toggle('active', glassEnabled);
                liquidGlassModeBtn.classList.toggle('active', liquidGlassEnabled);
                retroModeBtn.classList.toggle('active', retroEnabled);
                bingWallpaperBtn.classList.toggle('active', bingEnabled);
                themeLightBtn.classList.toggle('active', currentTheme === 'light');
                themeDarkBtn.classList.toggle('active', currentTheme === 'dark');
                // 更新主题
                htmlElement.setAttribute('data-theme', currentTheme);
                // 更新语言
                const t = translations[currentLang];
                siteTitle.textContent = t.siteTitle;
                mainTitle.innerHTML = t.titleHtml;
                document.querySelector('.announcement-title').textContent = t.announcementTitle;
                document.querySelector('.announcement-subtitle').textContent = t.announcementSubtitle;
                document.querySelector('.footer-note').textContent = t.footer;
                // 更新背景
                if (bingEnabled) {
                    fetch('https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1')
                        .then(r => r.json())
                        .then(d => { if(d.images?.length) { document.body.style.backgroundImage = `url("https://www.bing.com${d.images[0].url}")`; } })
                        .catch(() => {});
                } else {
                    document.body.style.backgroundImage = '';
                }
            }

            // 菜单控制
            hamburgerBtn.addEventListener('click', () => {
                isMenuOpen = !isMenuOpen;
                hamburgerBtn.classList.toggle('active', isMenuOpen);
                sidebarMenu.classList.toggle('open', isMenuOpen);
                menuOverlay.classList.toggle('visible', isMenuOpen);
            });
            menuOverlay.addEventListener('click', () => {
                isMenuOpen = false;
                hamburgerBtn.classList.remove('active');
                sidebarMenu.classList.remove('open');
                menuOverlay.classList.remove('visible');
            });

            // 设置弹窗
            settingsTrigger.addEventListener('click', () => {
                settingsOverlay.classList.add('visible');
                isMenuOpen = false;
                hamburgerBtn.classList.remove('active');
                sidebarMenu.classList.remove('open');
                menuOverlay.classList.remove('visible');
                updateUI();
            });
            settingsCloseBtn.addEventListener('click', () => settingsOverlay.classList.remove('visible'));
            settingsOverlay.addEventListener('click', e => { if(e.target === settingsOverlay) settingsOverlay.classList.remove('visible'); });

            // 主题
            themeLightBtn.addEventListener('click', () => { currentTheme = 'light'; localStorage.setItem('theme','light'); updateUI(); });
            themeDarkBtn.addEventListener('click', () => { currentTheme = 'dark'; localStorage.setItem('theme','dark'); updateUI(); });

            // 模式
            glassModeBtn.addEventListener('click', () => {
                glassEnabled = !glassEnabled;
                localStorage.setItem('glassMode', glassEnabled?'enabled':'disabled');
                if(glassEnabled) { liquidGlassEnabled=false; retroEnabled=false; localStorage.setItem('liquidGlassMode','disabled'); localStorage.setItem('retroMode','disabled'); }
                updateUI();
            });
            liquidGlassModeBtn.addEventListener('click', () => {
                liquidGlassEnabled = !liquidGlassEnabled;
                localStorage.setItem('liquidGlassMode', liquidGlassEnabled?'enabled':'disabled');
                if(liquidGlassEnabled) { glassEnabled=false; retroEnabled=false; localStorage.setItem('glassMode','disabled'); localStorage.setItem('retroMode','disabled'); }
                updateUI();
            });
            retroModeBtn.addEventListener('click', () => {
                retroEnabled = !retroEnabled;
                localStorage.setItem('retroMode', retroEnabled?'enabled':'disabled');
                if(retroEnabled) { glassEnabled=false; liquidGlassEnabled=false; localStorage.setItem('glassMode','disabled'); localStorage.setItem('liquidGlassMode','disabled'); }
                updateUI();
            });
            bingWallpaperBtn.addEventListener('click', () => {
                bingEnabled = !bingEnabled;
                localStorage.setItem('bingWallpaper', bingEnabled?'enabled':'disabled');
                updateUI();
            });

            // 语言
            langButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    currentLang = btn.getAttribute('data-lang');
                    localStorage.setItem('lang', currentLang);
                    htmlElement.setAttribute('lang', currentLang);
                    updateUI();
                });
            });

            // 拨号盘
            dialpadTrigger.addEventListener('click', () => {
                dialpadOverlay.classList.add('visible');
                isMenuOpen = false;
                hamburgerBtn.classList.remove('active');
                sidebarMenu.classList.remove('open');
                menuOverlay.classList.remove('visible');
            });
            dialClose.addEventListener('click', () => dialpadOverlay.classList.remove('visible'));
            dialDelete.addEventListener('click', () => { dialValue = dialValue.slice(0,-1); dialpadDisplay.textContent = dialValue; });
            dialpadOverlay.addEventListener('click', e => { if(e.target === dialpadOverlay) dialpadOverlay.classList.remove('visible'); });

            document.addEventListener('keydown', e => {
                if(e.key === 'Escape') {
                    if(isMenuOpen) { isMenuOpen=false; hamburgerBtn.classList.remove('active'); sidebarMenu.classList.remove('open'); menuOverlay.classList.remove('visible'); }
                    if(settingsOverlay.classList.contains('visible')) settingsOverlay.classList.remove('visible');
                    if(dialpadOverlay.classList.contains('visible')) dialpadOverlay.classList.remove('visible');
                }
            });

            buildDialpad();
            updateUI();
        })();
    </script>
