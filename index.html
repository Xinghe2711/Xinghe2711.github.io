<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>欢迎来到一架国泰航空A330的网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            /* 防止横向滚动 */
        }

        .container {
            text-align: center;
            padding: clamp(1.5rem, 5vw, 2.5rem) clamp(1rem, 4vw, 2rem);
            max-width: 600px;
            width: 100%;
            margin: auto;
        }

        h1 {
            font-size: clamp(1.4rem, 5vw, 2.2rem);
            /* 随视口平滑缩放 */
            font-weight: 300;
            color: #1a1a1a;
            letter-spacing: 0.04em;
            line-height: 1.5;
            margin-bottom: clamp(1.5rem, 4vw, 2rem);
            word-break: keep-all;
            /* 防止单词断开 */
            text-wrap: balance;
            /* 现代浏览器平衡换行 */
        }

        .divider {
            width: 48px;
            height: 1px;
            background-color: #cccccc;
            margin: 0 auto clamp(1.5rem, 4vw, 2rem) auto;
            transition: width 0.4s ease;
        }

        /* 桌面端悬停分割线伸长 */
        @media (hover: hover) and (pointer: fine) {
            .container:hover .divider {
                width: 80px;
            }
        }

        /* 按钮基础样式 */
        .btn {
            display: inline-block;
            padding: clamp(0.7rem, 2.5vw, 0.9rem) clamp(2rem, 8vw, 2.8rem);
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            font-weight: 400;
            color: #1a1a1a;
            background-color: transparent;
            border: 1px solid #1a1a1a;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 0.08em;
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            outline: none;
            -webkit-touch-callout: none;
            /* 禁止iOS长按弹出菜单 */
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background-color: #1a1a1a;
            transform: translate(-50%, -50%);
            transition: width 0.5s ease, height 0.5s ease;
            z-index: 0;
        }

        .btn span {
            position: relative;
            z-index: 1;
            transition: color 0.35s ease;
        }

        /* 仅对支持悬停的设备启用悬停效果 */
        @media (hover: hover) and (pointer: fine) {
            .btn:hover {
                border-color: #1a1a1a;
                box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            }

            .btn:hover::after {
                width: 400px;
                height: 400px;
            }

            .btn:hover span {
                color: #ffffff;
            }
        }

        /* 触屏设备点击反馈 */
        .btn:active {
            transform: scale(0.96);
            transition-duration: 0.15s;
            background-color: rgba(0, 0, 0, 0.03);
            /* 轻微背景反馈，移动端可见 */
        }

        .footer-note {
            margin-top: clamp(2rem, 6vw, 2.8rem);
            font-size: clamp(0.6rem, 2vw, 0.7rem);
            color: #aaaaaa;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* 针对极窄屏幕进一步优化 */
        @media (max-width: 360px) {
            h1 {
                letter-spacing: 0.02em;
            }

            .btn {
                padding: 0.7rem 1.8rem;
                letter-spacing: 0.05em;
            }
        }

        /* 横屏手机或小平板 */
        @media (min-width: 768px) and (max-width: 1024px) and (orientation: landscape) {
            h1 {
                font-size: 2.2rem;
            }
        }

        /* 大桌面微调 */
        @media (min-width: 1200px) {
            .container {
                max-width: 700px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            欢迎来到<br>
            一架国泰航空A330的网站
        </h1>

        <div class="divider"></div>

        <a href="https://space.bilibili.com/3546948707551378?spm_id_from=333.1007.0.0"
        target="_blank"
        rel="noopener noreferrer"
        class="btn"
        aria-label="访问我的 bilibili 空间">
        <span>我的 bilibili</span>
    </a>

    <div class="footer-note">Cathay Pacific &bull; A330 &bull; Minimal</div>
</div>
</body>
</html>
