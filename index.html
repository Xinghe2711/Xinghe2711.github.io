<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>欢迎来到一架国泰航空A330官方网站</title>
    <style>
        /* ========== CSS 变量（主题） ========== */
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #aaaaaa;
            --divider: #cccccc;
            --btn-border: #1a1a1a;
            --btn-hover-bg: #1a1a1a;
            --btn-hover-text: #ffffff;
            --menu-bg: rgba(255, 255, 255, 0.9);
            --menu-shadow: rgba(0, 0, 0, 0.12);
            --menu-item-hover: #f5f5f5;
            --accent: #0077cc;
            --accent-hover: #005fa3;
            --btn-primary: #0077cc;
            --btn-primary-hover: #005fa3;
            --btn-primary-text: #ffffff;
            --download-btn-bg: #ffffff;
            --download-btn-border: #1a1a1a;
            --download-btn-text: #1a1a1a;
            --download-btn-hover-bg: #0077cc;
            --download-btn-hover-text: #ffffff;
            --announcement-bg: #ffffff;
            --announcement-border: #1a1a1a;
            --announcement-title: #1a1a1a;
            --announcement-subtitle: #888888;
            --modal-bg: #ffffff;
            --modal-overlay: rgba(0, 0, 0, 0.4);
            --dial-key-bg: #f0f0f0;
            --dial-key-hover: #e0e0e0;
            --dial-display-bg: #f8f8f8;
            --dial-display-text: #1a1a1a;
            --sidebar-width: 280px;
        }

        [data-theme="dark"] {
            --bg: #121212;
            --text: #f0f0f0;
            --text-secondary: #888888;
            --divider: #3a3a3a;
            --btn-border: #f0f0f0;
            --btn-hover-bg: #f0f0f0;
            --btn-hover-text: #121212;
            --menu-bg: rgba(30, 30, 30, 0.95);
            --menu-shadow: rgba(0, 0, 0, 0.6);
            --menu-item-hover: #2a2a2a;
            --accent: #42a5f5;
            --accent-hover: #64b5f6;
            --btn-primary: #42a5f5;
            --btn-primary-hover: #64b5f6;
            --btn-primary-text: #121212;
            --download-btn-bg: #1e1e1e;
            --download-btn-border: #f0f0f0;
            --download-btn-text: #f0f0f0;
            --download-btn-hover-bg: #42a5f5;
            --download-btn-hover-text: #121212;
            --announcement-bg: #1e1e1e;
            --announcement-border: #f0f0f0;
            --announcement-title: #f0f0f0;
            --announcement-subtitle: #888888;
            --modal-bg: #1e1e1e;
            --modal-overlay: rgba(0, 0, 0, 0.6);
            --dial-key-bg: #2a2a2a;
            --dial-key-hover: #3a3a3a;
            --dial-display-bg: #171717;
            --dial-display-text: #f0f0f0;
            --sidebar-width: 280px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            transition: background-color 0.5s ease, color 0.4s ease;
        }

        /* ========== 透明模式（毛玻璃） ========== */
        body.glass-mode {
            background-color: rgba(255, 255, 255, 0.4);
        }

        [data-theme="dark"] body.glass-mode {
            background-color: rgba(18, 18, 18, 0.4);
        }

        body.glass-mode .container {
            background-color: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 2rem 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] body.glass-mode .container {
            background-color: rgba(30, 30, 30, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        body.glass-mode .sidebar-menu {
            background-color: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
        }

        [data-theme="dark"] body.glass-mode .sidebar-menu {
            background-color: rgba(30, 30, 30, 0.6);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }

        body.glass-mode .dialpad-modal {
            background-color: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        [data-theme="dark"] body.glass-mode .dialpad-modal {
            background-color: rgba(30, 30, 30, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        body.glass-mode .announcement {
            background-color: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.2);
        }

        [data-theme="dark"] body.glass-mode .announcement {
            background-color: rgba(30, 30, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* 透明模式下让按钮也半透明 */
        body.glass-mode .btn,
        body.glass-mode .btn-download {
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        body.glass-mode .btn {
            background-color: rgba(0, 119, 204, 0.75);
            border-color: rgba(0, 119, 204, 0.5);
        }

        body.glass-mode .btn-download {
            background-color: rgba(255, 255, 255, 0.6);
            border-color: rgba(0, 0, 0, 0.2);
        }

        [data-theme="dark"] body.glass-mode .btn-download {
            background-color: rgba(30, 30, 30, 0.6);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* ========== 液态玻璃模式（iOS 26 风格） ========== */
        body.liquid-glass-mode {
            background-color: rgba(255, 255, 255, 0.25);
        }

        [data-theme="dark"] body.liquid-glass-mode {
            background-color: rgba(18, 18, 18, 0.25);
        }

        /* 主容器液态玻璃效果 */
        body.liquid-glass-mode .container {
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.45) 0%,
                    rgba(255, 255, 255, 0.18) 40%,
                    rgba(255, 255, 255, 0.32) 70%,
                    rgba(255, 255, 255, 0.5) 100%);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            padding: 2.2rem 1.6rem;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25),
                0 12px 48px rgba(0, 0, 0, 0.12),
                0 2px 12px rgba(0, 0, 0, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.5),
                inset 0 -1px 0 rgba(0, 0, 0, 0.03);
            position: relative;
            transition: background 0.5s ease, box-shadow 0.5s ease, border-radius 0.5s ease, backdrop-filter 0.5s ease;
        }

        body.liquid-glass-mode .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 45%;
            border-radius: 28px 28px 50% 50%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.1) 100%);
            pointer-events: none;
            z-index: 1;
            opacity: 0.7;
        }

        body.liquid-glass-mode .container > * {
            position: relative;
            z-index: 2;
        }

        [data-theme="dark"] body.liquid-glass-mode .container {
            background: linear-gradient(135deg,
                    rgba(60, 60, 60, 0.45) 0%,
                    rgba(30, 30, 30, 0.2) 40%,
                    rgba(45, 45, 45, 0.35) 70%,
                    rgba(60, 60, 60, 0.5) 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08),
                0 12px 48px rgba(0, 0, 0, 0.4),
                0 2px 12px rgba(0, 0, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.15),
                inset 0 -1px 0 rgba(0, 0, 0, 0.2);
        }

        /* 侧边栏液态玻璃 */
        body.liquid-glass-mode .sidebar-menu {
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.5) 0%,
                    rgba(255, 255, 255, 0.22) 50%,
                    rgba(255, 255, 255, 0.4) 100%);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border-left: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: -2px 0 20px rgba(0, 0, 0, 0.06),
                inset 1px 0 0 rgba(255, 255, 255, 0.4);
        }

        [data-theme="dark"] body.liquid-glass-mode .sidebar-menu {
            background: linear-gradient(180deg,
                    rgba(50, 50, 50, 0.5) 0%,
                    rgba(25, 25, 25, 0.25) 50%,
                    rgba(40, 40, 40, 0.4) 100%);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: -2px 0 20px rgba(0, 0, 0, 0.25),
                inset 1px 0 0 rgba(255, 255, 255, 0.1);
        }

        /* 拨号盘液态玻璃 */
        body.liquid-glass-mode .dialpad-modal {
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.55) 0%,
                    rgba(255, 255, 255, 0.25) 50%,
                    rgba(255, 255, 255, 0.45) 100%);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.3),
                0 16px 56px rgba(0, 0, 0, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        [data-theme="dark"] body.liquid-glass-mode .dialpad-modal {
            background: linear-gradient(135deg,
                    rgba(55, 55, 55, 0.55) 0%,
                    rgba(28, 28, 28, 0.3) 50%,
                    rgba(45, 45, 45, 0.45) 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08),
                0 16px 56px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        /* 公告栏液态玻璃 */
        body.liquid-glass-mode .announcement {
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.5) 0%,
                    rgba(255, 255, 255, 0.2) 50%,
                    rgba(255, 255, 255, 0.4) 100%);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.45);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2),
                0 4px 20px rgba(0, 0, 0, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        [data-theme="dark"] body.liquid-glass-mode .announcement {
            background: linear-gradient(135deg,
                    rgba(55, 55, 55, 0.5) 0%,
                    rgba(28, 28, 28, 0.25) 50%,
                    rgba(45, 45, 45, 0.4) 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05),
                0 4px 20px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        /* 液态玻璃模式下的按钮 */
        body.liquid-glass-mode .btn {
            background: linear-gradient(135deg,
                    rgba(0, 119, 204, 0.7) 0%,
                    rgba(0, 119, 204, 0.4) 50%,
                    rgba(0, 119, 204, 0.6) 100%);
            backdrop-filter: blur(10px) saturate(150%);
            -webkit-backdrop-filter: blur(10px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15),
                0 4px 16px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.35);
            color: #ffffff;
        }

        [data-theme="dark"] body.liquid-glass-mode .btn {
            background: linear-gradient(135deg,
                    rgba(66, 165, 245, 0.7) 0%,
                    rgba(66, 165, 245, 0.4) 50%,
                    rgba(66, 165, 245, 0.6) 100%);
            color: #121212;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        body.liquid-glass-mode .btn-download {
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.6) 0%,
                    rgba(255, 255, 255, 0.25) 50%,
                    rgba(255, 255, 255, 0.45) 100%);
            backdrop-filter: blur(12px) saturate(140%);
            -webkit-backdrop-filter: blur(12px) saturate(140%);
            border: 1px solid rgba(0, 0, 0, 0.2);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2),
                0 4px 16px rgba(0, 0, 0, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        [data-theme="dark"] body.liquid-glass-mode .btn-download {
            background: linear-gradient(135deg,
                    rgba(55, 55, 55, 0.6) 0%,
                    rgba(28, 28, 28, 0.3) 50%,
                    rgba(45, 45, 45, 0.5) 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f0f0f0;
        }

        /* ========== 汉堡菜单按钮 ========== */
        .hamburger-btn {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 1002;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 12px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            width: 48px;
            height: 48px;
            transition: background-color 0.25s ease, transform 0.25s ease;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .hamburger-btn:hover {
            background-color: rgba(0, 119, 204, 0.08);
        }

        .hamburger-btn:active {
            transform: scale(0.92);
        }

        .hamburger-line {
            display: block;
            width: 24px;
            height: 2.5px;
            background-color: var(--accent);
            border-radius: 4px;
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55),
                opacity 0.3s ease,
                width 0.3s ease;
            transform-origin: center;
        }

        .hamburger-btn.active .hamburger-line:nth-child(1) {
            transform: translateY(7.5px) rotate(45deg);
        }

        .hamburger-btn.active .hamburger-line:nth-child(2) {
            opacity: 0;
            width: 0;
        }

        .hamburger-btn.active .hamburger-line:nth-child(3) {
            transform: translateY(-7.5px) rotate(-45deg);
        }

        /* ========== 遮罩层 ========== */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-overlay);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .menu-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* ========== 侧边栏菜单 ========== */
        .sidebar-menu {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 1001;
            background-color: var(--menu-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            width: var(--sidebar-width);
            max-width: 85vw;
            height: 100%;
            box-shadow: -4px 0 24px var(--menu-shadow);
            padding: 24px 0;
            overflow-y: auto;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.3s ease;
            border-left: 1px solid var(--divider);
            -webkit-overflow-scrolling: touch;
        }

        .sidebar-menu.open {
            transform: translateX(0);
        }

        .menu-section {
            padding: 16px 20px 8px 20px;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 12px 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text);
            transition: background-color 0.2s ease;
            font-family: inherit;
            letter-spacing: 0.04em;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            user-select: none;
            -webkit-touch-callout: none;
            text-decoration: none;
            text-align: left;
        }

        .menu-item:hover {
            background-color: var(--menu-item-hover);
        }

        .menu-item:active {
            background-color: var(--menu-item-hover);
        }

        .menu-item-label {
            font-weight: 400;
        }

        .menu-item-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .menu-item-indicator .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent);
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .menu-item-indicator .dot.inactive {
            background-color: var(--text-secondary);
            transform: scale(0.7);
        }

        .menu-divider {
            height: 1px;
            background-color: var(--divider);
            margin: 8px 0;
            opacity: 0.5;
        }

        /* ========== 主内容容器 ========== */
        .container {
            text-align: center;
            padding: clamp(1.5rem, 5vw, 2.5rem) clamp(1rem, 4vw, 2rem);
            max-width: 600px;
            width: 100%;
            margin: auto;
            transition: color 0.4s ease, background-color 0.3s ease, backdrop-filter 0.3s ease, border-radius 0.3s ease, box-shadow 0.3s ease;
        }

        h1 {
            font-size: clamp(1.4rem, 5vw, 2.2rem);
            font-weight: 300;
            color: var(--text);
            letter-spacing: 0.04em;
            line-height: 1.5;
            margin-bottom: clamp(1.5rem, 4vw, 2rem);
            word-break: keep-all;
            text-wrap: balance;
            transition: color 0.4s ease;
        }

        .divider {
            width: 48px;
            height: 1px;
            background-color: var(--divider);
            margin: 0 auto clamp(1.5rem, 4vw, 2rem) auto;
            transition: width 0.4s ease, background-color 0.4s ease;
        }

        @media (hover: hover) and (pointer: fine) {
            .container:hover .divider {
                width: 80px;
            }
        }

        /* 主按钮组 */
        .button-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .btn {
            display: inline-block;
            padding: clamp(0.7rem, 2.5vw, 0.9rem) clamp(2rem, 8vw, 2.8rem);
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            font-weight: 400;
            color: var(--btn-primary-text);
            background-color: var(--btn-primary);
            border: 1px solid var(--btn-primary);
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 0.08em;
            transition: background-color 0.3s ease, border-color 0.3s ease, transform 0.15s ease, backdrop-filter 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            outline: none;
            -webkit-touch-callout: none;
            white-space: nowrap;
        }

        @media (hover: hover) and (pointer: fine) {
            .btn:hover {
                background-color: var(--btn-primary-hover);
                border-color: var(--btn-primary-hover);
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            }
        }

        .btn:active {
            transform: scale(0.96);
        }

        /* 公告栏 */
        .announcement {
            margin: 1.8rem auto 1.8rem auto;
            max-width: 360px;
            width: 100%;
            padding: 0.8rem 1.2rem;
            border: 1.5px solid var(--announcement-border);
            border-radius: 12px;
            background-color: var(--announcement-bg);
            text-align: center;
            transition: background-color 0.3s ease, border-color 0.3s ease, backdrop-filter 0.3s ease, box-shadow 0.3s ease;
        }

        .announcement-title {
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            color: var(--announcement-title);
            margin-bottom: 0.2rem;
        }

        .announcement-subtitle {
            font-size: 0.75rem;
            color: var(--announcement-subtitle);
            letter-spacing: 0.05em;
        }

        /* 下载按钮组（长条形） */
        .download-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            margin-top: 1.8rem;
            width: 100%;
        }

        .btn-download {
            display: block;
            width: 100%;
            max-width: 360px;
            padding: 0.8rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 400;
            text-align: center;
            color: var(--download-btn-text);
            background-color: var(--download-btn-bg);
            border: 1.5px solid var(--download-btn-border);
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 0.04em;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.15s ease, backdrop-filter 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            outline: none;
            -webkit-touch-callout: none;
            white-space: nowrap;
        }

        @media (hover: hover) and (pointer: fine) {
            .btn-download:hover {
                background-color: var(--download-btn-hover-bg);
                border-color: var(--download-btn-hover-bg);
                color: var(--download-btn-hover-text);
                box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
            }

        .btn-download:active {
            background-color: var(--download-btn-hover-bg);
            border-color: var(--download-btn-hover-bg);
            color: var(--download-btn-hover-text);
            transform: scale(0.98);
        }

        .footer-note {
            margin-top: clamp(2rem, 6vw, 2.8rem);
            font-size: clamp(0.6rem, 2vw, 0.7rem);
            color: var(--text-secondary);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 300;
            transition: color 0.4s ease;
        }

        /* ========== 拨号盘模态框 ========== */
        .dialpad-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-overlay);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 1rem;
        }

        .dialpad-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .dialpad-modal {
            background-color: var(--modal-bg);
            border-radius: 20px;
            padding: 1.5rem 1.5rem 1.8rem;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 12px 60px rgba(0, 0, 0, 0.2);
            transform: translateY(20px) scale(0.95);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.3s ease, backdrop-filter 0.3s ease;
            border: 1px solid var(--divider);
        }

        .dialpad-overlay.visible .dialpad-modal {
            transform: translateY(0) scale(1);
        }

        .dialpad-display {
            background-color: var(--dial-display-bg);
            border-radius: 12px;
            padding: 0.8rem 1rem;
            font-size: 1.6rem;
            font-weight: 300;
            text-align: right;
            letter-spacing: 0.05em;
            color: var(--dial-display-text);
            margin-bottom: 1.2rem;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            overflow-x: auto;
            white-space: nowrap;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .dialpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.6rem;
        }

        .dial-key {
            background-color: var(--dial-key-bg);
            border: none;
            border-radius: 50%;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 1.3rem;
            font-weight: 400;
            color: var(--text);
            transition: background-color 0.2s ease, transform 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            user-select: none;
            -webkit-touch-callout: none;
            font-family: inherit;
        }

        .dial-key:hover {
            background-color: var(--dial-key-hover);
        }

        .dial-key:active {
            transform: scale(0.9);
            background-color: var(--dial-key-hover);
        }

        .dial-key .sub {
            font-size: 0.55rem;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .dial-actions {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.6rem;
        }

        .dial-action {
            flex: 1;
            padding: 0.7rem 0;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            transition: background-color 0.2s ease, transform 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            user-select: none;
            -webkit-touch-callout: none;
            font-family: inherit;
        }

        .dial-action.delete {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--divider);
        }

        .dial-action.delete:hover {
            background-color: var(--dial-key-hover);
        }

        .dial-action.close {
            background-color: var(--accent);
            color: #ffffff;
        }

        .dial-action.close:hover {
            background-color: var(--accent-hover);
        }

        .dial-action:active {
            transform: scale(0.95);
        }

        /* ========== 响应式 ========== */
        @media (max-width: 360px) {

        }

        @media (min-width: 1200px) {

            }

            }
        }
    </style>
</head>

<script>
    (function() {
        // ========== DOM 引用 ==========
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const sidebarMenu = document.getElementById('sidebarMenu');
        const menuOverlay = document.getElementById('menuOverlay');
        const themeToggle = document.getElementById('themeToggle');
        const themeDot = document.getElementById('themeDot');
        const themeLabel = document.getElementById('themeLabel');
        const glassToggle = document.getElementById('glassToggle');
        const glassDot = document.getElementById('glassDot');
        const liquidGlassToggle = document.getElementById('liquidGlassToggle');
        const liquidGlassDot = document.getElementById('liquidGlassDot');
        const bingWallpaperToggle = document.getElementById('bingWallpaperToggle');
        const bingWallpaperDot = document.getElementById('bingWallpaperDot');
        const langZh = document.getElementById('langZh');
        const langEn = document.getElementById('langEn');
        const langZhDot = document.getElementById('langZhDot');
        const langEnDot = document.getElementById('langEnDot');
        const mainTitle = document.getElementById('mainTitle');
        const bilibiliBtn = document.getElementById('bilibiliBtn');
        const footerNote = document.querySelector('.footer-note');
        const htmlElement = document.documentElement;
        const dialpadOverlay = document.getElementById('dialpadOverlay');
        const dialpadDisplay = document.getElementById('dialpadDisplay');
        const dialpadGrid = document.getElementById('dialpadGrid');
        const dialDelete = document.getElementById('dialDelete');
        const dialClose = document.getElementById('dialClose');
        const dialpadTrigger = document.getElementById('dialpadTrigger');
        const announcementTitle = document.querySelector('.announcement-title');
        const announcementSubtitle = document.querySelector('.announcement-subtitle');

        // ========== 状态 ==========
        let isMenuOpen = false;
        let currentTheme = localStorage.getItem('theme') || 'light';
        let currentLang = localStorage.getItem('lang') || 'zh';
        let bingEnabled = localStorage.getItem('bingWallpaper') === 'enabled';
        let glassEnabled = localStorage.getItem('glassMode') === 'enabled';
        let liquidGlassEnabled = localStorage.getItem('liquidGlassMode') === 'enabled';
        let dialValue = '';

        // ========== 翻译字典 ==========
        const translations = {
            zh: {
                settings: '设置',
                theme: '主题模式',
                light: '浅色',
                dark: '深色',
                glassMode: '透明模式',
                liquidGlassMode: '液态玻璃模式',
                bingWallpaper: '必应每日一图',
                language: '语言',
                links: '链接',
                bilibili: '我的 bilibili',
                fanGroup: '加入粉丝群',
                announcementTitle: '公告栏',
                announcementSubtitle: '支持多语言',
                footer: 'Cathay Pacific • A330 • Minimal',
                titleHtml: '欢迎来到<br>一架国泰航空A330官方网站',
                menuAria: '打开菜单',
                closeMenuAria: '关闭菜单',
                delete: '删除',
                close: '关闭'
            },
            en: {
                settings: 'Settings',
                theme: 'Theme',
                light: 'Light',
                dark: 'Dark',
                glassMode: 'Glass Mode',
                liquidGlassMode: 'Liquid Glass',
                bingWallpaper: 'Bing Daily Wallpaper',
                language: 'Language',
                links: 'Links',
                bilibili: 'My bilibili',
                fanGroup: 'Join Fan Group',
                announcementTitle: 'Announcement',
                announcementSubtitle: 'Supports multiple languages',
                footer: 'Cathay Pacific • A330 • Minimal',
                titleHtml: 'Welcome to<br>the official website of a Cathay Pacific A330',
                menuAria: 'Open menu',
                closeMenuAria: 'Close menu',
                delete: 'Delete',
                close: 'Close'
            }
        };

        // ========== 拨号盘按键数据 ==========
        const dialKeys = [
            { digit: '1', sub: '' },
            { digit: '2', sub: 'ABC' },
            { digit: '3', sub: 'DEF' },
            { digit: '4', sub: 'GHI' },
            { digit: '5', sub: 'JKL' },
            { digit: '6', sub: 'MNO' },
            { digit: '7', sub: 'PQRS' },
            { digit: '8', sub: 'TUV' },
            { digit: '9', sub: 'WXYZ' },
            { digit: '*', sub: '' },
            { digit: '0', sub: '+' },
            { digit: '#', sub: '' },
        ];

        // ========== 初始化拨号盘 ==========
        function buildDialpad() {
            dialKeys.forEach(key => {
                const btn = document.createElement('button');
                btn.className = 'dial-key';
                btn.setAttribute('data-digit', key.digit);
                btn.innerHTML = key.digit + (key.sub ? `<span class="sub">${key.sub}</span>` : '');
                btn.addEventListener('click', function() {
                    dialValue += key.digit;
                    updateDialDisplay();
                });
                dialpadGrid.appendChild(btn);
            });
            updateDialDisplay();
        }

        function updateDialDisplay() {
            dialpadDisplay.textContent = dialValue || '';
        }

        function openDialpad() {
            dialValue = '';
            updateDialDisplay();
            dialpadOverlay.classList.add('visible');
            closeMenu();
        }

        function closeDialpad() {
            dialpadOverlay.classList.remove('visible');
        }

        // ========== 必应每日一图 ==========
        async function fetchBingWallpaper() {
            try {
                const response = await fetch('https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1');
                const data = await response.json();
                if (data && data.images && data.images.length > 0) {
                    const url = 'https://www.bing.com' + data.images[0].url;
                    applyBingBackground(url);
                }
            } catch (error) {
                console.warn('获取必应壁纸失败，使用默认背景', error);
                clearBingBackground();
            }
        }

        function applyBingBackground(url) {
            document.body.style.backgroundImage = `url("${url}")`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
            document.body.style.backgroundAttachment = 'fixed';
        }

        function clearBingBackground() {
            document.body.style.backgroundImage = '';
            document.body.style.backgroundSize = '';
            document.body.style.backgroundPosition = '';
            document.body.style.backgroundAttachment = '';
        }

        function updateBackground() {
            if (bingEnabled) {
                fetchBingWallpaper();
            } else {
                clearBingBackground();
            }
        }

        function updateBingIndicator() {
            if (bingEnabled) {
                bingWallpaperDot.classList.remove('inactive');
            } else {
                bingWallpaperDot.classList.add('inactive');
            }
        }

        // ========== 透明模式 ==========
        function updateGlassMode() {
            if (glassEnabled && !liquidGlassEnabled) {
                document.body.classList.add('glass-mode');
                document.body.classList.remove('liquid-glass-mode');
                glassDot.classList.remove('inactive');
            } else if (!glassEnabled && !liquidGlassEnabled) {
                document.body.classList.remove('glass-mode');
                glassDot.classList.add('inactive');
            } else {
                glassDot.classList.add('inactive');
            }
        }

        // ========== 液态玻璃模式 ==========
        function updateLiquidGlassMode() {
            if (liquidGlassEnabled) {
                document.body.classList.add('liquid-glass-mode');
                document.body.classList.remove('glass-mode');
                liquidGlassDot.classList.remove('inactive');
                glassDot.classList.add('inactive');
            } else {
                document.body.classList.remove('liquid-glass-mode');
                liquidGlassDot.classList.add('inactive');
                if (glassEnabled) {
                    document.body.classList.add('glass-mode');
                    glassDot.classList.remove('inactive');
                }
            }
        }

        // ========== 初始化主题 ==========
        function initTheme() {
            htmlElement.setAttribute('data-theme', currentTheme);
            updateThemeUI();
        }

        function updateThemeUI() {
            const isDark = currentTheme === 'dark';
            if (isDark) {
                themeDot.classList.remove('inactive');
                themeLabel.textContent = translations[currentLang].dark;
            } else {
                themeDot.classList.add('inactive');
                themeLabel.textContent = translations[currentLang].light;
            }
        }

        // ========== 初始化语言 ==========
        function initLanguage() {
            updateLanguageUI();
        }

        function updateLanguageUI() {
            mainTitle.innerHTML = translations[currentLang].titleHtml;

            const btnSpan = bilibiliBtn.querySelector('span');
            if (btnSpan) {
                btnSpan.textContent = translations[currentLang].bilibili;
            }

            document.querySelectorAll('[data-i18n="fanGroup"]').forEach(el => {
                el.textContent = translations[currentLang].fanGroup;
            });

            if (announcementTitle) announcementTitle.textContent = translations[currentLang].announcementTitle;
            if (announcementSubtitle) announcementSubtitle.textContent = translations[currentLang].announcementSubtitle;

            footerNote.textContent = translations[currentLang].footer;

            document.querySelectorAll('[data-i18n="settings"]').forEach(el => {
                el.textContent = translations[currentLang].settings;
            });
            document.querySelectorAll('[data-i18n="theme"]').forEach(el => {
                el.textContent = translations[currentLang].theme;
            });
            document.querySelectorAll('[data-i18n="glassMode"]').forEach(el => {
                el.textContent = translations[currentLang].glassMode;
            });
            document.querySelectorAll('[data-i18n="liquidGlassMode"]').forEach(el => {
                el.textContent = translations[currentLang].liquidGlassMode;
            });
            document.querySelectorAll('[data-i18n="bingWallpaper"]').forEach(el => {
                el.textContent = translations[currentLang].bingWallpaper;
            });
            document.querySelectorAll('[data-i18n="language"]').forEach(el => {
                el.textContent = translations[currentLang].language;
            });
            document.querySelectorAll('[data-i18n="links"]').forEach(el => {
                el.textContent = translations[currentLang].links;
            });

            updateThemeUI();
            updateLanguageIndicators();
            updateBingIndicator();
            updateGlassMode();
            updateLiquidGlassMode();

            const menuAria = isMenuOpen ? translations[currentLang].closeMenuAria : translations[currentLang]
                .menuAria;
            hamburgerBtn.setAttribute('aria-label', menuAria);

            dialDelete.textContent = translations[currentLang].delete;
            dialClose.textContent = translations[currentLang].close;
        }

        function updateLanguageIndicators() {
            if (currentLang === 'zh') {
                langZhDot.classList.remove('inactive');
                langEnDot.classList.add('inactive');
            } else {
                langZhDot.classList.add('inactive');
                langEnDot.classList.remove('inactive');
            }
        }

        // ========== 菜单开关 ==========
        function openMenu() {
            isMenuOpen = true;
            hamburgerBtn.classList.add('active');
            sidebarMenu.classList.add('open');
            menuOverlay.classList.add('visible');
            hamburgerBtn.setAttribute('aria-expanded', 'true');
            hamburgerBtn.setAttribute('aria-label', translations[currentLang].closeMenuAria);
        }

        function closeMenu() {
            isMenuOpen = false;
            hamburgerBtn.classList.remove('active');
            sidebarMenu.classList.remove('open');
            menuOverlay.classList.remove('visible');
            hamburgerBtn.setAttribute('aria-expanded', 'false');
            hamburgerBtn.setAttribute('aria-label', translations[currentLang].menuAria);
        }

        function toggleMenu() {
            if (isMenuOpen) {
                closeMenu();
            } else {
                openMenu();
            }
        }

        // ========== 事件监听 ==========
        hamburgerBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleMenu();
        });

        menuOverlay.addEventListener('click', closeMenu);

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (isMenuOpen) closeMenu();
                if (dialpadOverlay.classList.contains('visible')) closeDialpad();
            }
        });

        themeToggle.addEventListener('click', function() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            htmlElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('theme', currentTheme);
            updateThemeUI();
            if (!bingEnabled) {
                clearBingBackground();
            }
        });

        glassToggle.addEventListener('click', function() {
            glassEnabled = !glassEnabled;
            localStorage.setItem('glassMode', glassEnabled ? 'enabled' : 'disabled');
            if (glassEnabled && liquidGlassEnabled) {
                liquidGlassEnabled = false;
                localStorage.setItem('liquidGlassMode', 'disabled');
                document.body.classList.remove('liquid-glass-mode');
                liquidGlassDot.classList.add('inactive');
            }
            updateGlassMode();
            updateLiquidGlassMode();
        });

        liquidGlassToggle.addEventListener('click', function() {
            liquidGlassEnabled = !liquidGlassEnabled;
            localStorage.setItem('liquidGlassMode', liquidGlassEnabled ? 'enabled' : 'disabled');
            if (liquidGlassEnabled && glassEnabled) {
                glassEnabled = false;
                localStorage.setItem('glassMode', 'disabled');
                document.body.classList.remove('glass-mode');
                glassDot.classList.add('inactive');
            }
            updateGlassMode();
            updateLiquidGlassMode();
        });

        bingWallpaperToggle.addEventListener('click', function() {
            bingEnabled = !bingEnabled;
            localStorage.setItem('bingWallpaper', bingEnabled ? 'enabled' : 'disabled');
            updateBingIndicator();
            updateBackground();
        });

        langZh.addEventListener('click', function() {
            if (currentLang !== 'zh') {
                currentLang = 'zh';
                localStorage.setItem('lang', 'zh');
                htmlElement.setAttribute('lang', 'zh-CN');
                updateLanguageUI();
            }
            closeMenu();
        });

        langEn.addEventListener('click', function() {
            if (currentLang !== 'en') {
                currentLang = 'en';
                localStorage.setItem('lang', 'en');
                htmlElement.setAttribute('lang', 'en');
                updateLanguageUI();
            }
            closeMenu();
        });

        dialpadTrigger.addEventListener('click', function() {
            openDialpad();
        });

        dialDelete.addEventListener('click', function() {
            dialValue = dialValue.slice(0, -1);
            updateDialDisplay();
        });

        dialClose.addEventListener('click', closeDialpad);

        dialpadOverlay.addEventListener('click', function(e) {
            if (e.target === dialpadOverlay) {
                closeDialpad();
            }
        });

        // ========== 启动 ==========
        buildDialpad();
        initTheme();
        initLanguage();
        updateLanguageIndicators();
        updateBingIndicator();
        updateGlassMode();
        updateLiquidGlassMode();
        updateBackground();

        if (currentTheme === 'dark') {
            themeDot.classList.remove('inactive');
        } else {
            themeDot.classList.add('inactive');
        }
    })();
</script>
</body>
</html>
