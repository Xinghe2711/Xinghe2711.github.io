    <script>
        (function() {
            // ========== DOM 引用 ==========
            const hamburgerBtn = document.getElementById('hamburgerBtn');
            const sidebarMenu = document.getElementById('sidebarMenu');
            const menuOverlay = document.getElementById('menuOverlay');
            const themeToggle = document.getElementById('themeToggle');
            const themeDot = document.getElementById('themeDot');
            const themeLabel = document.getElementById('themeLabel');
            const glassToggle = document.getElementById('glassToggle');
            const glassDot = document.getElementById('glassDot');
            const liquidGlassToggle = document.getElementById('liquidGlassToggle');
            const liquidGlassDot = document.getElementById('liquidGlassDot');
            const bingWallpaperToggle = document.getElementById('bingWallpaperToggle');
            const bingWallpaperDot = document.getElementById('bingWallpaperDot');
            const langButtons = {
                'zh-CN': document.getElementById('langZhCN'),
                'zh-TW': document.getElementById('langZhTW'),
                'ja': document.getElementById('langJa'),
                'en-GB': document.getElementById('langEnGB'),
                'en-US': document.getElementById('langEnUS'),
                'ko': document.getElementById('langKo'),
            };
            const langDots = {
                'zh-CN': document.getElementById('langZhCNDot'),
                'zh-TW': document.getElementById('langZhTWDot'),
                'ja': document.getElementById('langJaDot'),
                'en-GB': document.getElementById('langEnGBDot'),
                'en-US': document.getElementById('langEnUSDot'),
                'ko': document.getElementById('langKoDot'),
            };
            const mainTitle = document.getElementById('mainTitle');
            const bilibiliBtn = document.getElementById('bilibiliBtn');
            const footerNote = document.querySelector('.footer-note');
            const htmlElement = document.documentElement;
            const dialpadOverlay = document.getElementById('dialpadOverlay');
            const dialpadDisplay = document.getElementById('dialpadDisplay');
            const dialpadGrid = document.getElementById('dialpadGrid');
            const dialDelete = document.getElementById('dialDelete');
            const dialClose = document.getElementById('dialClose');
            const dialpadTrigger = document.getElementById('dialpadTrigger');
            const announcementTitle = document.querySelector('.announcement-title');
            const announcementSubtitle = document.querySelector('.announcement-subtitle');
            const siteTitle = document.querySelector('.site-title');

            // ========== 状态 ==========
            let isMenuOpen = false;
            let currentTheme = localStorage.getItem('theme') || 'light';
            let currentLang = localStorage.getItem('lang') || 'zh-CN';
            let bingEnabled = localStorage.getItem('bingWallpaper') === 'enabled';
            let glassEnabled = localStorage.getItem('glassMode') === 'enabled';
            let liquidGlassEnabled = localStorage.getItem('liquidGlassMode') === 'enabled';
            let dialValue = '';

            // ========== 翻译字典 ==========
            const translations = {
                'zh-CN': {
                    siteTitle: '一架国泰航空A330官方网站',
                    settings: '设置', theme: '主题模式', light: '浅色', dark: '深色',
                    glassMode: '透明模式', liquidGlassMode: '液态玻璃模式', bingWallpaper: '必应每日一图',
                    language: '语言', links: '链接', bilibili: '我的 bilibili', fanGroup: '加入粉丝群',
                    announcementTitle: '公告栏', announcementSubtitle: '支持多语言',
                    footer: 'Cathay Pacific • A330 • Minimal', titleHtml: '欢迎来到<br>一架国泰航空A330官方网站',
                    menuAria: '打开菜单', closeMenuAria: '关闭菜单', delete: '删除', close: '关闭'
                },
                'zh-TW': {
                    siteTitle: '一架國泰航空A330官方網站',
                    settings: '設置', theme: '主題模式', light: '淺色', dark: '深色',
                    glassMode: '透明模式', liquidGlassMode: '液態玻璃模式', bingWallpaper: '必應每日一圖',
                    language: '語言', links: '連結', bilibili: '我的 bilibili', fanGroup: '加入粉絲群',
                    announcementTitle: '公告欄', announcementSubtitle: '支援多語言',
                    footer: 'Cathay Pacific • A330 • Minimal', titleHtml: '歡迎來到<br>一架國泰航空A330官方網站',
                    menuAria: '打開菜單', closeMenuAria: '關閉菜單', delete: '刪除', close: '關閉'
                },
                'ja': {
                    siteTitle: 'キャセイパシフィックA330公式サイト',
                    settings: '設定', theme: 'テーマ', light: 'ライト', dark: 'ダーク',
                    glassMode: 'グラスモード', liquidGlassMode: 'リキッドグラス', bingWallpaper: 'Bing 毎日の壁紙',
                    language: '言語', links: 'リンク', bilibili: 'My bilibili', fanGroup: 'ファングループに参加',
                    announcementTitle: 'お知らせ', announcementSubtitle: '多言語対応',
                    footer: 'Cathay Pacific • A330 • Minimal', titleHtml: 'ようこそ<br>キャセイパシフィックA330公式サイトへ',
                    menuAria: 'メニューを開く', closeMenuAria: 'メニューを閉じる', delete: '削除', close: '閉じる'
                },
                'en-GB': {
                    siteTitle: 'Cathay Pacific A330 Official Website',
                    settings: 'Settings', theme: 'Theme', light: 'Light', dark: 'Dark',
                    glassMode: 'Glass Mode', liquidGlassMode: 'Liquid Glass', bingWallpaper: 'Bing Daily Wallpaper',
                    language: 'Language', links: 'Links', bilibili: 'My bilibili', fanGroup: 'Join Fan Group',
                    announcementTitle: 'Announcement', announcementSubtitle: 'Supports multiple languages',
                    footer: 'Cathay Pacific • A330 • Minimal', titleHtml: 'Welcome to<br>the official website of a Cathay Pacific A330',
                    menuAria: 'Open menu', closeMenuAria: 'Close menu', delete: 'Delete', close: 'Close'
                },
                'en-US': {
                    siteTitle: 'Cathay Pacific A330 Official Website',
                    settings: 'Settings', theme: 'Theme', light: 'Light', dark: 'Dark',
                    glassMode: 'Glass Mode', liquidGlassMode: 'Liquid Glass', bingWallpaper: 'Bing Daily Wallpaper',
                    language: 'Language', links: 'Links', bilibili: 'My bilibili', fanGroup: 'Join Fan Group',
                    announcementTitle: 'Announcement', announcementSubtitle: 'Supports multiple languages',
                    footer: 'Cathay Pacific • A330 • Minimal', titleHtml: 'Welcome to<br>the official website of a Cathay Pacific A330',
                    menuAria: 'Open menu', closeMenuAria: 'Close menu', delete: 'Delete', close: 'Close'
                },
                'ko': {
                    siteTitle: '캐세이퍼시픽 A330 공식 웹사이트',
                    settings: '설정', theme: '테마', light: '라이트', dark: '다크',
                    glassMode: '글래스 모드', liquidGlassMode: '리퀴드 글래스', bingWallpaper: 'Bing 일일 배경화면',
                    language: '언어', links: '링크', bilibili: 'My bilibili', fanGroup: '팬 그룹 가입',
                    announcementTitle: '공지사항', announcementSubtitle: '다국어 지원',
                    footer: 'Cathay Pacific • A330 • Minimal', titleHtml: '캐세이퍼시픽 A330<br>공식 웹사이트에 오신 것을 환영합니다',
                    menuAria: '메뉴 열기', closeMenuAria: '메뉴 닫기', delete: '삭제', close: '닫기'
                }
            };

            // ========== 拨号盘按键数据 ==========
            const dialKeys = [
                { digit: '1', sub: '' }, { digit: '2', sub: 'ABC' }, { digit: '3', sub: 'DEF' },
                { digit: '4', sub: 'GHI' }, { digit: '5', sub: 'JKL' }, { digit: '6', sub: 'MNO' },
                { digit: '7', sub: 'PQRS' }, { digit: '8', sub: 'TUV' }, { digit: '9', sub: 'WXYZ' },
                { digit: '*', sub: '' }, { digit: '0', sub: '+' }, { digit: '#', sub: '' },
            ];

            // ========== 初始化拨号盘 ==========
            function buildDialpad() {
                dialKeys.forEach(key => {
                    const btn = document.createElement('button');
                    btn.className = 'dial-key';
                    btn.setAttribute('data-digit', key.digit);
                    btn.innerHTML = key.digit + (key.sub ? `<span class="sub">${key.sub}</span>` : '');
                    btn.addEventListener('click', function() {
                        dialValue += key.digit;
                        updateDialDisplay();
                    });
                    dialpadGrid.appendChild(btn);
                });
                updateDialDisplay();
            }
            function updateDialDisplay() { dialpadDisplay.textContent = dialValue || ''; }
            function openDialpad() { dialValue = ''; updateDialDisplay(); dialpadOverlay.classList.add('visible'); closeMenu(); }
            function closeDialpad() { dialpadOverlay.classList.remove('visible'); }

            // ========== 必应壁纸 ==========
            async function fetchBingWallpaper() {
                try {
                    const response = await fetch('https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1');
                    const data = await response.json();
                    if (data && data.images && data.images.length > 0) {
                        const url = 'https://www.bing.com' + data.images[0].url;
                        applyBingBackground(url);
                    }
                } catch (error) {
                    console.warn('获取必应壁纸失败，使用默认背景', error);
                    clearBingBackground();
                }
            }
            function applyBingBackground(url) {
                document.body.style.backgroundImage = `url("${url}")`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                document.body.style.backgroundAttachment = 'fixed';
            }
            function clearBingBackground() {
                document.body.style.backgroundImage = '';
                document.body.style.backgroundSize = '';
                document.body.style.backgroundPosition = '';
                document.body.style.backgroundAttachment = '';
            }
            function updateBackground() {
                if (bingEnabled) { fetchBingWallpaper(); } else { clearBingBackground(); }
            }
            function updateBingIndicator() {
                bingWallpaperDot.classList.toggle('inactive', !bingEnabled);
            }

            // ========== 玻璃模式 ==========
            function updateGlassMode() {
                if (glassEnabled && !liquidGlassEnabled) {
                    document.body.classList.add('glass-mode');
                    document.body.classList.remove('liquid-glass-mode');
                    glassDot.classList.remove('inactive');
                } else if (!glassEnabled && !liquidGlassEnabled) {
                    document.body.classList.remove('glass-mode');
                    glassDot.classList.add('inactive');
                } else {
                    glassDot.classList.add('inactive');
                }
            }
            function updateLiquidGlassMode() {
                if (liquidGlassEnabled) {
                    document.body.classList.add('liquid-glass-mode');
                    document.body.classList.remove('glass-mode');
                    liquidGlassDot.classList.remove('inactive');
                    glassDot.classList.add('inactive');
                } else {
                    document.body.classList.remove('liquid-glass-mode');
                    liquidGlassDot.classList.add('inactive');
                    if (glassEnabled) {
                        document.body.classList.add('glass-mode');
                        glassDot.classList.remove('inactive');
                    }
                }
            }

            // ========== 主题 ==========
            function initTheme() { htmlElement.setAttribute('data-theme', currentTheme); updateThemeUI(); }
            function updateThemeUI() {
                const isDark = currentTheme === 'dark';
                themeDot.classList.toggle('inactive', !isDark);
                themeLabel.textContent = translations[currentLang][isDark ? 'dark' : 'light'];
            }

            // ========== 语言 ==========
            function initLanguage() { updateLanguageUI(); }
            function updateLanguageUI() {
                const t = translations[currentLang];
                siteTitle.textContent = t.siteTitle;
                mainTitle.innerHTML = t.titleHtml;
                document.querySelectorAll('[data-i18n="bilibili"]').forEach(el => el.textContent = t.bilibili);
                document.querySelectorAll('[data-i18n="fanGroup"]').forEach(el => el.textContent = t.fanGroup);
                if (announcementTitle) announcementTitle.textContent = t.announcementTitle;
                if (announcementSubtitle) announcementSubtitle.textContent = t.announcementSubtitle;
                footerNote.textContent = t.footer;
                document.querySelectorAll('[data-i18n="settings"]').forEach(el => el.textContent = t.settings);
                document.querySelectorAll('[data-i18n="theme"]').forEach(el => el.textContent = t.theme);
                document.querySelectorAll('[data-i18n="glassMode"]').forEach(el => el.textContent = t.glassMode);
                document.querySelectorAll('[data-i18n="liquidGlassMode"]').forEach(el => el.textContent = t.liquidGlassMode);
                document.querySelectorAll('[data-i18n="bingWallpaper"]').forEach(el => el.textContent = t.bingWallpaper);
                document.querySelectorAll('[data-i18n="language"]').forEach(el => el.textContent = t.language);
                document.querySelectorAll('[data-i18n="links"]').forEach(el => el.textContent = t.links);
                updateLanguageIndicators();
                updateThemeUI();
                const menuAria = isMenuOpen ? t.closeMenuAria : t.menuAria;
                hamburgerBtn.setAttribute('aria-label', menuAria);
                dialDelete.textContent = t.delete;
                dialClose.textContent = t.close;
            }
            function updateLanguageIndicators() {
                Object.keys(langDots).forEach(key => {
                    langDots[key].classList.toggle('inactive', key !== currentLang);
                });
            }

            // ========== 菜单开关 ==========
            function openMenu() {
                isMenuOpen = true;
                hamburgerBtn.classList.add('active');
                sidebarMenu.classList.add('open');
                menuOverlay.classList.add('visible');
                hamburgerBtn.setAttribute('aria-expanded', 'true');
                hamburgerBtn.setAttribute('aria-label', translations[currentLang].closeMenuAria);
            }
            function closeMenu() {
                isMenuOpen = false;
                hamburgerBtn.classList.remove('active');
                sidebarMenu.classList.remove('open');
                menuOverlay.classList.remove('visible');
                hamburgerBtn.setAttribute('aria-expanded', 'false');
                hamburgerBtn.setAttribute('aria-label', translations[currentLang].menuAria);
            }
            function toggleMenu() {
                if (isMenuOpen) { closeMenu(); } else { openMenu(); }
            }

            // ========== 事件监听 ==========
            hamburgerBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleMenu();
            });
            menuOverlay.addEventListener('click', closeMenu);
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (isMenuOpen) closeMenu();
                    if (dialpadOverlay.classList.contains('visible')) closeDialpad();
                }
            });

            themeToggle.addEventListener('click', function() {
                currentTheme = currentTheme === 'light' ? 'dark' : 'light';
                htmlElement.setAttribute('data-theme', currentTheme);
                localStorage.setItem('theme', currentTheme);
                updateThemeUI();
                if (!bingEnabled) { clearBingBackground(); }
            });

            glassToggle.addEventListener('click', function() {
                glassEnabled = !glassEnabled;
                localStorage.setItem('glassMode', glassEnabled ? 'enabled' : 'disabled');
                if (glassEnabled && liquidGlassEnabled) {
                    liquidGlassEnabled = false;
                    localStorage.setItem('liquidGlassMode', 'disabled');
                    document.body.classList.remove('liquid-glass-mode');
                    liquidGlassDot.classList.add('inactive');
                }
                updateGlassMode();
                updateLiquidGlassMode();
            });

            liquidGlassToggle.addEventListener('click', function() {
                liquidGlassEnabled = !liquidGlassEnabled;
                localStorage.setItem('liquidGlassMode', liquidGlassEnabled ? 'enabled' : 'disabled');
                if (liquidGlassEnabled && glassEnabled) {
                    glassEnabled = false;
                    localStorage.setItem('glassMode', 'disabled');
                    document.body.classList.remove('glass-mode');
                    glassDot.classList.add('inactive');
                }
                updateGlassMode();
                updateLiquidGlassMode();
            });

            bingWallpaperToggle.addEventListener('click', function() {
                bingEnabled = !bingEnabled;
                localStorage.setItem('bingWallpaper', bingEnabled ? 'enabled' : 'disabled');
                updateBingIndicator();
                updateBackground();
            });

            // 语言按钮
            Object.keys(langButtons).forEach(lang => {
                langButtons[lang].addEventListener('click', function() {
                    if (currentLang !== lang) {
                        currentLang = lang;
                        localStorage.setItem('lang', lang);
                        htmlElement.setAttribute('lang', lang);
                        updateLanguageUI();
                    }
                    closeMenu();
                });
            });

            // 拨号盘
            dialpadTrigger.addEventListener('click', function() { openDialpad(); });
            dialDelete.addEventListener('click', function() { dialValue = dialValue.slice(0, -1); updateDialDisplay(); });
            dialClose.addEventListener('click', closeDialpad);
            dialpadOverlay.addEventListener('click', function(e) {
                if (e.target === dialpadOverlay) { closeDialpad(); }
            });

            // ========== 启动 ==========
            buildDialpad();
            initTheme();
            initLanguage();
            updateLanguageIndicators();
            updateBingIndicator();
            updateGlassMode();
            updateLiquidGlassMode();
            updateBackground();

            if (currentTheme === 'dark') {
                themeDot.classList.remove('inactive');
            } else {
                themeDot.classList.add('inactive');
            }
        })();
    </script>
