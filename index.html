<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>欢迎来到一架国泰航空A330官方网站</title>
    <style>
        /* ==================== CSS 变量 ==================== */
        :root {
            --bg: #ffffff;
            --default-bg-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600&q=80');
            --text: #1a1a1a;
            --text-secondary: #aaaaaa;
            --divider: #cccccc;
            --menu-bg: #ffffff;
            --menu-shadow: rgba(0,0,0,0.12);
            --menu-item-hover: #f5f5f5;
            --accent: #0077cc;
            --accent-hover: #005fa3;
            --btn-primary: #0077cc;
            --btn-primary-hover: #005fa3;
            --btn-primary-text: #ffffff;
            --download-btn-bg: #ffffff;
            --download-btn-border: #1a1a1a;
            --download-btn-text: #1a1a1a;
            --download-btn-hover-bg: #0077cc;
            --download-btn-hover-text: #ffffff;
            --announcement-bg: #ffffff;
            --announcement-border: #1a1a1a;
            --announcement-title: #1a1a1a;
            --announcement-subtitle: #888888;
            --modal-bg: #ffffff;
            --modal-overlay: rgba(0,0,0,0.4);
            --dial-key-bg: #f0f0f0;
            --dial-key-hover: #e0e0e0;
            --dial-display-bg: #f8f8f8;
            --dial-display-text: #1a1a1a;
            --sidebar-width: 300px;
            --topbar-height: 60px;
        }

        [data-theme="dark"] {
            --bg: #121212;
            --default-bg-image: none;
            --text: #f0f0f0;
            --text-secondary: #888888;
            --divider: #3a3a3a;
            --menu-bg: #1e1e1e;
            --menu-shadow: rgba(0,0,0,0.6);
            --menu-item-hover: #2a2a2a;
            --accent: #42a5f5;
            --accent-hover: #64b5f6;
            --btn-primary: #42a5f5;
            --btn-primary-hover: #64b5f6;
            --btn-primary-text: #121212;
            --download-btn-bg: #1e1e1e;
            --download-btn-border: #f0f0f0;
            --download-btn-text: #f0f0f0;
            --download-btn-hover-bg: #42a5f5;
            --download-btn-hover-text: #121212;
            --announcement-bg: #1e1e1e;
            --announcement-border: #f0f0f0;
            --announcement-title: #f0f0f0;
            --announcement-subtitle: #888888;
            --modal-bg: #1e1e1e;
            --modal-overlay: rgba(0,0,0,0.6);
            --dial-key-bg: #2a2a2a;
            --dial-key-hover: #3a3a3a;
            --dial-display-bg: #171717;
            --dial-display-text: #f0f0f0;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            background-color: var(--bg);
            background-image: var(--default-bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            padding-top: calc(var(--topbar-height) + 1rem);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            transition: background-color 0.5s ease, color 0.4s ease, background-image 0.5s ease;
        }

        /* ==================== 顶部栏 ==================== */
        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--topbar-height);
            background-color: var(--bg);
            border-bottom: 1px solid var(--divider);
            z-index: 1003;
            display: flex;
            align-items: center;
            padding: 0 20px;
            transition: all 0.3s ease;
        }
        .site-title {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text);
            letter-spacing: 0.04em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ==================== 汉堡按钮 ==================== */
        .hamburger-btn {
            position: fixed;
            top: calc((var(--topbar-height) - 44px) / 2);
            right: 20px;
            z-index: 1004;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            width: 44px;
            height: 44px;
            transition: background-color 0.25s ease, transform 0.25s ease;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            user-select: none;
        }
        .hamburger-btn:hover { background-color: rgba(0,119,204,0.08); }
        .hamburger-btn:active { transform: scale(0.92); }
        .hamburger-line {
            display: block;
            width: 22px;
            height: 2.5px;
            background-color: var(--accent);
            border-radius: 4px;
            transition: all 0.4s cubic-bezier(0.68,-0.55,0.27,1.55);
        }
        .hamburger-btn.active .hamburger-line:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
        .hamburger-btn.active .hamburger-line:nth-child(2) { opacity:0; }
        .hamburger-btn.active .hamburger-line:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }

        /* ==================== 遮罩 ==================== */
        .menu-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background-color: var(--modal-overlay);
            z-index: 1000; opacity:0; pointer-events:none;
            transition: opacity 0.3s ease;
        }
        .menu-overlay.visible { opacity:1; pointer-events:auto; }

        /* ==================== 侧边栏 ==================== */
        .sidebar-menu {
            position: fixed;
            top:0; right:0;
            z-index: 1001;
            background-color: var(--menu-bg);
            width: var(--sidebar-width);
            max-width: 85vw;
            height: 100%;
            box-shadow: -4px 0 24px var(--menu-shadow);
            padding: 20px 0;
            overflow-y: auto;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.22,1,0.36,1);
            border-left: 1px solid var(--divider);
            -webkit-overflow-scrolling: touch;
        }
        .sidebar-menu.open { transform: translateX(0); }

        .menu-section {
            padding: 14px 20px 6px 20px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 11px 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text);
            transition: background-color 0.2s ease;
            font-family: inherit;
            letter-spacing: 0.04em;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            user-select: none;
            text-decoration: none;
            text-align: left;
        }
        .menu-item:hover { background-color: var(--menu-item-hover); }
        .menu-item:active { background-color: var(--menu-item-hover); }
        .menu-item-label { font-weight: 400; }
        .menu-item-indicator {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.85rem; color: var(--accent); font-weight: 500;
        }
        .menu-item-indicator .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background-color: var(--accent);
            transition: all 0.3s ease;
        }
        .menu-item-indicator .dot.inactive {
            background-color: var(--text-secondary);
            transform: scale(0.7);
        }
        .menu-divider { height:1px; background-color:var(--divider); margin:6px 0; opacity:0.5; }

        /* ==================== 主容器 ==================== */
        .container {
            text-align: center;
            padding: clamp(1.5rem, 5vw, 2.5rem) clamp(1rem, 4vw, 2rem);
            max-width: 560px;
            width: 100%;
            margin: auto;
            transition: all 0.35s ease;
        }
        h1 {
            font-size: clamp(1.4rem, 5vw, 2.2rem);
            font-weight: 300;
            color: var(--text);
            letter-spacing: 0.04em;
            line-height: 1.5;
            margin-bottom: 1.5rem;
            word-break: keep-all;
            transition: color 0.4s ease;
        }
        .divider {
            width: 48px; height: 1px;
            background-color: var(--divider);
            margin: 0 auto 1.5rem auto;
            transition: all 0.4s ease;
        }
        .button-group {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 0.8rem; margin-top: 0.5rem;
        }
        .btn {
            display: inline-block;
            padding: 0.7rem 2rem;
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--btn-primary-text);
            background-color: var(--btn-primary);
            border: 1px solid var(--btn-primary);
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 0.06em;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            outline: none;
            white-space: nowrap;
        }
        .btn:hover { background-color: var(--btn-primary-hover); border-color: var(--btn-primary-hover); }
        .btn:active { transform: scale(0.96); }

        .announcement {
            margin: 1.5rem auto;
            max-width: 360px;
            width: 100%;
            padding: 0.8rem 1.2rem;
            border: 1.5px solid var(--announcement-border);
            border-radius: 12px;
            background-color: var(--announcement-bg);
            text-align: center;
            transition: all 0.3s ease;
        }
        .announcement-title {
            font-size: 1.2rem; font-weight: 500;
            letter-spacing: 0.1em;
            color: var(--announcement-title);
            margin-bottom: 0.2rem;
        }
        .announcement-subtitle {
            font-size: 0.75rem;
            color: var(--announcement-subtitle);
            letter-spacing: 0.05em;
        }

        .download-group {
            display: flex; flex-direction: column; align-items: center;
            gap: 0.7rem; margin-top: 1.5rem; width: 100%;
        }
        .btn-download {
            display: block;
            width: 100%;
            max-width: 360px;
            padding: 0.75rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 400;
            text-align: center;
            color: var(--download-btn-text);
            background-color: var(--download-btn-bg);
            border: 1.5px solid var(--download-btn-border);
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 0.04em;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            white-space: nowrap;
        }
        .btn-download:hover {
            background-color: var(--download-btn-hover-bg);
            border-color: var(--download-btn-hover-bg);
            color: var(--download-btn-hover-text);
        }

        .footer-note {
            margin-top: 2rem;
            font-size: 0.65rem;
            color: var(--text-secondary);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* ==================== 拨号盘 ==================== */
        .dialpad-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background-color: var(--modal-overlay);
            z-index: 2000;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 1rem;
        }
        .dialpad-overlay.visible { opacity:1; pointer-events:auto; }
        .dialpad-modal {
            background-color: var(--modal-bg);
            border-radius: 18px;
            padding: 1.2rem;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 12px 48px rgba(0,0,0,0.2);
            transform: translateY(20px) scale(0.95);
            transition: all 0.35s cubic-bezier(0.22,1,0.36,1);
            border: 1px solid var(--divider);
        }
        .dialpad-overlay.visible .dialpad-modal { transform: translateY(0) scale(1); }
        .dialpad-display {
            background-color: var(--dial-display-bg);
            border-radius: 10px;
            padding: 0.7rem 0.8rem;
            font-size: 1.4rem;
            text-align: right;
            color: var(--dial-display-text);
            margin-bottom: 1rem;
            min-height: 48px;
            display: flex; align-items: center; justify-content: flex-end;
            overflow-x: auto;
            white-space: nowrap;
        }
        .dialpad-grid {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 0.5rem;
        }
        .dial-key {
            background-color: var(--dial-key-bg);
            border: none;
            border-radius: 50%;
            aspect-ratio: 1;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text);
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            font-family: inherit;
        }
        .dial-key:hover { background-color: var(--dial-key-hover); }
        .dial-key:active { transform: scale(0.9); }
        .dial-key .sub {
            font-size: 0.5rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .dial-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
        .dial-action {
            flex: 1;
            padding: 0.6rem 0;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            font-family: inherit;
        }
        .dial-action.delete {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--divider);
        }
        .dial-action.close {
            background-color: var(--accent);
            color: #fff;
        }

        /* ==================== 透明模式（iOS 16 毛玻璃） ==================== */
        body.glass-mode {
            background-color: rgba(255,255,255,0.35);
        }
        [data-theme="dark"] body.glass-mode {
            background-color: rgba(18,18,18,0.35);
        }
        body.glass-mode .top-bar {
            background-color: rgba(255,255,255,0.75);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border-bottom: 1px solid rgba(255,255,255,0.5);
        }
        [data-theme="dark"] body.glass-mode .top-bar {
            background-color: rgba(28,28,30,0.75);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        body.glass-mode .container {
            background-color: rgba(255,255,255,0.72);
            backdrop-filter: blur(22px) saturate(190%);
            -webkit-backdrop-filter: blur(22px) saturate(190%);
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 6px 28px rgba(0,0,0,0.07),
                inset 0 1px 0 rgba(255,255,255,0.65);
        }
        [data-theme="dark"] body.glass-mode .container {
            background-color: rgba(44,44,46,0.72);
            backdrop-filter: blur(22px) saturate(190%);
            -webkit-backdrop-filter: blur(22px) saturate(190%);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 6px 28px rgba(0,0,0,0.25),
                inset 0 1px 0 rgba(255,255,255,0.06);
        }
        body.glass-mode .sidebar-menu {
            background-color: rgba(255,255,255,0.72);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border-left: 1px solid rgba(255,255,255,0.5);
        }
        [data-theme="dark"] body.glass-mode .sidebar-menu {
            background-color: rgba(28,28,30,0.72);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border-left: 1px solid rgba(255,255,255,0.1);
        }
        body.glass-mode .btn {
            background-color: rgba(0,122,255,0.8);
            border-color: rgba(255,255,255,0.35);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        body.glass-mode .btn-download {
            background-color: rgba(255,255,255,0.55);
            border-color: rgba(0,0,0,0.18);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        [data-theme="dark"] body.glass-mode .btn-download {
            background-color: rgba(44,44,46,0.55);
            border-color: rgba(255,255,255,0.12);
            color: #f0f0f0;
        }
        body.glass-mode .announcement {
            background-color: rgba(255,255,255,0.55);
            border-color: rgba(0,0,0,0.18);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        [data-theme="dark"] body.glass-mode .announcement {
            background-color: rgba(44,44,46,0.55);
            border-color: rgba(255,255,255,0.12);
        }
        body.glass-mode .dialpad-modal {
            background-color: rgba(255,255,255,0.72);
            backdrop-filter: blur(22px) saturate(190%);
            -webkit-backdrop-filter: blur(22px) saturate(190%);
            border: 1px solid rgba(255,255,255,0.55);
        }
        [data-theme="dark"] body.glass-mode .dialpad-modal {
            background-color: rgba(28,28,30,0.72);
            backdrop-filter: blur(22px) saturate(190%);
            -webkit-backdrop-filter: blur(22px) saturate(190%);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* ==================== 液态玻璃模式（iOS 26） ==================== */
        body.liquid-glass-mode {
            background-color: rgba(255,255,255,0.2);
        }
        [data-theme="dark"] body.liquid-glass-mode {
            background-color: rgba(18,18,18,0.2);
        }
        body.liquid-glass-mode .top-bar {
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.15) 100%);
            backdrop-filter: blur(28px) saturate(200%);
            -webkit-backdrop-filter: blur(28px) saturate(200%);
            border-bottom: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 1px 0 rgba(255,255,255,0.2);
        }
        [data-theme="dark"] body.liquid-glass-mode .top-bar {
            background: linear-gradient(180deg, rgba(50,50,50,0.4) 0%, rgba(20,20,20,0.2) 100%);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        body.liquid-glass-mode .container {
            background: linear-gradient(135deg,
                rgba(255,255,255,0.4) 0%,
                rgba(255,255,255,0.12) 35%,
                rgba(255,255,255,0.25) 65%,
                rgba(255,255,255,0.45) 100%);
            backdrop-filter: blur(28px) saturate(210%);
            -webkit-backdrop-filter: blur(28px) saturate(210%);
            border-radius: 26px;
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.2),
                0 10px 40px rgba(0,0,0,0.1),
                0 2px 10px rgba(0,0,0,0.04),
                inset 0 1px 0 rgba(255,255,255,0.45),
                inset 0 -1px 0 rgba(0,0,0,0.02);
        }
        [data-theme="dark"] body.liquid-glass-mode .container {
            background: linear-gradient(135deg,
                rgba(55,55,55,0.4) 0%,
                rgba(25,25,25,0.15) 35%,
                rgba(40,40,40,0.3) 65%,
                rgba(55,55,55,0.45) 100%);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.06),
                0 10px 40px rgba(0,0,0,0.35),
                0 2px 10px rgba(0,0,0,0.12),
                inset 0 1px 0 rgba(255,255,255,0.12),
                inset 0 -1px 0 rgba(0,0,0,0.15);
        }
        body.liquid-glass-mode .sidebar-menu {
            background: linear-gradient(180deg,
                rgba(255,255,255,0.4) 0%,
                rgba(255,255,255,0.15) 50%,
                rgba(255,255,255,0.3) 100%);
            backdrop-filter: blur(28px) saturate(200%);
            -webkit-backdrop-filter: blur(28px) saturate(200%);
            border-left: 1px solid rgba(255,255,255,0.35);
            box-shadow: -2px 0 20px rgba(0,0,0,0.05),
                inset 1px 0 0 rgba(255,255,255,0.3);
        }
        [data-theme="dark"] body.liquid-glass-mode .sidebar-menu {
            background: linear-gradient(180deg,
                rgba(45,45,45,0.4) 0%,
                rgba(20,20,20,0.2) 50%,
                rgba(35,35,35,0.35) 100%);
            border-left: 1px solid rgba(255,255,255,0.1);
        }
        body.liquid-glass-mode .btn {
            background: linear-gradient(135deg,
                rgba(0,119,204,0.65) 0%,
                rgba(0,119,204,0.35) 50%,
                rgba(0,119,204,0.55) 100%);
            backdrop-filter: blur(10px) saturate(150%);
            -webkit-backdrop-filter: blur(10px) saturate(150%);
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 2px 14px rgba(0,0,0,0.08),
                inset 0 1px 0 rgba(255,255,255,0.3);
            color: #fff;
        }
        [data-theme="dark"] body.liquid-glass-mode .btn {
            background: linear-gradient(135deg,
                rgba(66,165,245,0.65) 0%,
                rgba(66,165,245,0.35) 50%,
                rgba(66,165,245,0.55) 100%);
            color: #121212;
        }
        body.liquid-glass-mode .btn-download {
            background: linear-gradient(135deg,
                rgba(255,255,255,0.5) 0%,
                rgba(255,255,255,0.2) 50%,
                rgba(255,255,255,0.35) 100%);
            backdrop-filter: blur(10px) saturate(140%);
            -webkit-backdrop-filter: blur(10px) saturate(140%);
            border: 1px solid rgba(0,0,0,0.15);
            box-shadow: 0 1px 10px rgba(0,0,0,0.04),
                inset 0 1px 0 rgba(255,255,255,0.35);
        }

                        applyBingBackground('https://www.bing.com' + d.images[0].url);
                    }
                } catch(e) { clearBingBackground(); }
            }
            function applyBingBackground(url) {
                document.body.style.backgroundImage = `url("${url}")`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                document.body.style.backgroundAttachment = 'fixed';
            }
            function clearBingBackground() {
                document.body.style.backgroundImage = '';
                document.body.style.backgroundSize = '';
                document.body.style.backgroundPosition = '';
                document.body.style.backgroundAttachment = '';
            }
            function updateBackground() { if(bingEnabled) fetchBingWallpaper(); else clearBingBackground(); }
            function updateBingIndicator() { bingWallpaperDot.classList.toggle('inactive', !bingEnabled); }

            function applyModeClasses() {
                document.body.classList.remove('glass-mode', 'liquid-glass-mode', 'retro-mode');
                if (retroEnabled) {
                    document.body.classList.add('retro-mode');
                    glassDot.classList.add('inactive');
                    liquidGlassDot.classList.add('inactive');
                    retroDot.classList.remove('inactive');
                } else if (liquidGlassEnabled) {
                    document.body.classList.add('liquid-glass-mode');
                    glassDot.classList.add('inactive');
                    liquidGlassDot.classList.remove('inactive');
                    retroDot.classList.add('inactive');
                } else if (glassEnabled) {
                    document.body.classList.add('glass-mode');
                    glassDot.classList.remove('inactive');
                    liquidGlassDot.classList.add('inactive');
                    retroDot.classList.add('inactive');
                } else {
                    glassDot.classList.add('inactive');
                    liquidGlassDot.classList.add('inactive');
                    retroDot.classList.add('inactive');
                }
            }

            function initTheme() { htmlElement.setAttribute('data-theme', currentTheme); updateThemeUI(); }
            function updateThemeUI() {
                const isDark = currentTheme === 'dark';
                themeDot.classList.toggle('inactive', !isDark);
                themeLabel.textContent = translations[currentLang][isDark ? 'dark':'light'];
            }

            function initLanguage() { updateLanguageUI(); }
            function updateLanguageUI() {
                const t = translations[currentLang];
                siteTitle.textContent = t.siteTitle;
                mainTitle.innerHTML = t.titleHtml;
                document.querySelectorAll('[data-i18n="bilibili"]').forEach(el=>el.textContent=t.bilibili);
                document.querySelectorAll('[data-i18n="fanGroup"]').forEach(el=>el.textContent=t.fanGroup);
                if(announcementTitle) announcementTitle.textContent=t.announcementTitle;
                if(announcementSubtitle) announcementSubtitle.textContent=t.announcementSubtitle;
                footerNote.textContent=t.footer;
                document.querySelectorAll('[data-i18n="settings"]').forEach(el=>el.textContent=t.settings);
                document.querySelectorAll('[data-i18n="theme"]').forEach(el=>el.textContent=t.theme);
                document.querySelectorAll('[data-i18n="glassMode"]').forEach(el=>el.textContent=t.glassMode);
                document.querySelectorAll('[data-i18n="liquidGlassMode"]').forEach(el=>el.textContent=t.liquidGlassMode);
                document.querySelectorAll('[data-i18n="bingWallpaper"]').forEach(el=>el.textContent=t.bingWallpaper);
                document.querySelectorAll('[data-i18n="retroMode"]').forEach(el=>el.textContent=t.retroMode);
                document.querySelectorAll('[data-i18n="language"]').forEach(el=>el.textContent=t.language);
                document.querySelectorAll('[data-i18n="links"]').forEach(el=>el.textContent=t.links);
                updateLanguageIndicators();
                updateThemeUI();
                const menuAria = isMenuOpen ? t.closeMenuAria : t.menuAria;
                hamburgerBtn.setAttribute('aria-label', menuAria);
                dialDelete.textContent = t.delete;
                dialClose.textContent = t.close;
            }
            function updateLanguageIndicators() {
                Object.keys(langDots).forEach(key => {
                    langDots[key].classList.toggle('inactive', key !== currentLang);
                });
            }

            function openMenu() {
                isMenuOpen = true;
                hamburgerBtn.classList.add('active');
                sidebarMenu.classList.add('open');
                menuOverlay.classList.add('visible');
                hamburgerBtn.setAttribute('aria-expanded','true');
                hamburgerBtn.setAttribute('aria-label', translations[currentLang].closeMenuAria);
            }
            function closeMenu() {
                isMenuOpen = false;
                hamburgerBtn.classList.remove('active');
                sidebarMenu.classList.remove('open');
                menuOverlay.classList.remove('visible');
                hamburgerBtn.setAttribute('aria-expanded','false');
                hamburgerBtn.setAttribute('aria-label', translations[currentLang].menuAria);
            }
            function toggleMenu() { if(isMenuOpen) closeMenu(); else openMenu(); }

            // ========== 事件 ==========
            hamburgerBtn.addEventListener('click', e=>{ e.stopPropagation(); toggleMenu(); });
            menuOverlay.addEventListener('click', closeMenu);
            document.addEventListener('keydown', e=>{
                if(e.key === 'Escape') {
                    if(isMenuOpen) closeMenu();
                    if(dialpadOverlay.classList.contains('visible')) closeDialpad();
                }
            });

            themeToggle.addEventListener('click', ()=>{
                currentTheme = currentTheme === 'light' ? 'dark' : 'light';
                htmlElement.setAttribute('data-theme', currentTheme);
                localStorage.setItem('theme', currentTheme);
                updateThemeUI();
                if(!bingEnabled) clearBingBackground();
            });

            glassToggle.addEventListener('click', ()=>{
                glassEnabled = !glassEnabled;
                localStorage.setItem('glassMode', glassEnabled?'enabled':'disabled');
                if(glassEnabled) {
                    liquidGlassEnabled=false; localStorage.setItem('liquidGlassMode','disabled');
                    retroEnabled=false; localStorage.setItem('retroMode','disabled');
                }
                applyModeClasses();
            });

            liquidGlassToggle.addEventListener('click', ()=>{
                liquidGlassEnabled = !liquidGlassEnabled;
                localStorage.setItem('liquidGlassMode', liquidGlassEnabled?'enabled':'disabled');
                if(liquidGlassEnabled) {
                    glassEnabled=false; localStorage.setItem('glassMode','disabled');
                    retroEnabled=false; localStorage.setItem('retroMode','disabled');
                }
                applyModeClasses();
            });

            bingWallpaperToggle.addEventListener('click', ()=>{
                bingEnabled = !bingEnabled;
                localStorage.setItem('bingWallpaper', bingEnabled?'enabled':'disabled');
                updateBingIndicator(); updateBackground();
            });

            retroToggle.addEventListener('click', ()=>{
                retroEnabled = !retroEnabled;
                localStorage.setItem('retroMode', retroEnabled?'enabled':'disabled');
                if(retroEnabled) {
                    glassEnabled=false; localStorage.setItem('glassMode','disabled');
                    liquidGlassEnabled=false; localStorage.setItem('liquidGlassMode','disabled');
                }
                applyModeClasses();
            });

            Object.keys(langButtons).forEach(lang=>{
                langButtons[lang].addEventListener('click', ()=>{
                    if(currentLang !== lang) {
                        currentLang = lang;
                        localStorage.setItem('lang', lang);
                        htmlElement.setAttribute('lang', lang);
                        updateLanguageUI();
                    }
                    closeMenu();
                });
            });

            dialpadTrigger.addEventListener('click', openDialpad);
            dialDelete.addEventListener('click', ()=>{ dialValue=dialValue.slice(0,-1); updateDialDisplay(); });
            dialClose.addEventListener('click', closeDialpad);
            dialpadOverlay.addEventListener('click', e=>{ if(e.target===dialpadOverlay) closeDialpad(); });

            // ========== 启动 ==========
            buildDialpad();
            initTheme();
            initLanguage();
            updateLanguageIndicators();
            updateBingIndicator();
            applyModeClasses();
            updateBackground();
            if(currentTheme === 'dark') themeDot.classList.remove('inactive'); else themeDot.classList.add('inactive');
        })();
    </script>
</body>
</html>
