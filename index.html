            let glassEnabled = localStorage.getItem('glassMode') === 'enabled';
            let liquidGlassEnabled = localStorage.getItem('liquidGlassMode') === 'enabled';
            let retroEnabled = localStorage.getItem('retroMode') === 'enabled';
            let wallpaperChoice = localStorage.getItem('wallpaperChoice') || 'default';
            let dialValue = '';
            let calcFirstOperand = null, calcOperator = null, calcShouldResetDisplay = false;

            const wallpaperURLs = {
                default: '',
                creeper_sleep: 'https://raw.githubusercontent.com/Xinghe2711/Xinghe2711.github.io/refs/heads/main/IMG_6140.jpeg',
                minecart: 'https://raw.githubusercontent.com/Xinghe2711/Xinghe2711.github.io/refs/heads/main/IMG_6134.jpeg',
                tnt: 'https://raw.githubusercontent.com/Xinghe2711/Xinghe2711.github.io/refs/heads/main/IMG_6141.jpeg'
            };

            const dialKeys = [
                { digit:'1', sub:'' }, { digit:'2', sub:'ABC' }, { digit:'3', sub:'DEF' },
                { digit:'4', sub:'GHI' }, { digit:'5', sub:'JKL' }, { digit:'6', sub:'MNO' },
                { digit:'7', sub:'PQRS' }, { digit:'8', sub:'TUV' }, { digit:'9', sub:'WXYZ' },
                { digit:'*', sub:'' }, { digit:'0', sub:'+' }, { digit:'#', sub:'' },
            ];

            function buildDialpad() {
                dialKeys.forEach(key => {
                    const btn = document.createElement('button');
                    btn.className = 'dial-key';
                    btn.innerHTML = key.digit + (key.sub ? `<span class="sub">${key.sub}</span>` : '');
                    btn.addEventListener('click', () => { dialValue += key.digit; dialpadDisplay.textContent = dialValue; });
                    dialpadGrid.appendChild(btn);
                });
            }

            async function fetchBingWallpaper() {
                const today = new Date().toISOString().slice(0,10);
                const cached = localStorage.getItem('bingWallpaperData');
                if (cached) {
                    try {
                        const { date, url } = JSON.parse(cached);
                        if (date === today) { applyWallpaper(url); return; }
                    } catch(e) {}
                }
                try {
                    const response = await fetch('https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&mkt=zh-CN');
                    const data = await response.json();
                    if (data && data.images && data.images.length > 0) {
                        const imageUrl = 'https://www.bing.com' + data.images[0].url;
                        localStorage.setItem('bingWallpaperData', JSON.stringify({ date: today, url: imageUrl }));
                        applyWallpaper(imageUrl);
                    }
                } catch(e) { applyWallpaper(''); }
            }

            function applyWallpaper(url) {
                if (url) {
                    document.body.style.backgroundImage = `url("${url}")`;
                    document.body.style.backgroundSize = 'cover';
                    document.body.style.backgroundPosition = 'center';
                    document.body.style.backgroundAttachment = 'fixed';
                } else {
                    // 清除内联背景，恢复CSS默认
                    document.body.style.backgroundImage = '';
                    document.body.style.backgroundSize = '';
                    document.body.style.backgroundPosition = '';
                    document.body.style.backgroundAttachment = '';
                }
            }

            function updateUI() {
                document.body.classList.remove('glass-mode','liquid-glass-mode','retro-mode');
                if (retroEnabled) document.body.classList.add('retro-mode');
                else if (liquidGlassEnabled) document.body.classList.add('liquid-glass-mode');
                else if (glassEnabled) document.body.classList.add('glass-mode');

                glassModeSwitch.classList.toggle('on', glassEnabled);
                liquidGlassModeSwitch.classList.toggle('on', liquidGlassEnabled);
                retroModeSwitch.classList.toggle('on', retroEnabled);
                bingWallpaperSwitch.classList.toggle('on', bingEnabled);

                themeDarkSwitch.classList.toggle('on', currentTheme === 'dark');
                htmlElement.setAttribute('data-theme', currentTheme);

                langSwitches.forEach(sw => {
                    sw.classList.toggle('on', sw.getAttribute('data-lang') === currentLang);
                });

                wallpaperBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.getAttribute('data-wallpaper') === wallpaperChoice);
                });

                // 设置背景
                if (bingEnabled) {
                    fetchBingWallpaper();
                } else {
                    if (wallpaperChoice === 'default') {
                        applyWallpaper('');
                    } else {
                        const url = wallpaperURLs[wallpaperChoice];
                        if (url) applyWallpaper(url);
                        else applyWallpaper('');
                    }
                }
            }

            function toggleMenu(force) {
                isMenuOpen = force !== undefined ? force : !isMenuOpen;
                hamburgerBtn.classList.toggle('active', isMenuOpen);
                sidebarMenu.classList.toggle('open', isMenuOpen);
                menuOverlay.classList.toggle('visible', isMenuOpen);
            }

            hamburgerBtn.addEventListener('click', () => toggleMenu());
            menuOverlay.addEventListener('click', () => toggleMenu(false));

            function closeAllModals() {
                settingsOverlay.classList.remove('visible');
                dialpadOverlay.classList.remove('visible');
                calcOverlay.classList.remove('visible');
            }

            settingsTrigger.addEventListener('click', () => { closeAllModals(); toggleMenu(false); settingsOverlay.classList.add('visible'); updateUI(); });
            settingsCloseBtn.addEventListener('click', () => settingsOverlay.classList.remove('visible'));
            settingsOverlay.addEventListener('click', e => { if(e.target === settingsOverlay) settingsOverlay.classList.remove('visible'); });

            calcTrigger.addEventListener('click', () => { closeAllModals(); toggleMenu(false); calcOverlay.classList.add('visible'); });
            calcOverlay.addEventListener('click', e => { if(e.target === calcOverlay) calcOverlay.classList.remove('visible'); });

            dialpadTrigger.addEventListener('click', () => { closeAllModals(); toggleMenu(false); dialpadOverlay.classList.add('visible'); });
            dialClose.addEventListener('click', () => dialpadOverlay.classList.remove('visible'));
            dialDelete.addEventListener('click', () => { dialValue = dialValue.slice(0,-1); dialpadDisplay.textContent = dialValue; });
            dialpadOverlay.addEventListener('click', e => { if(e.target === dialpadOverlay) dialpadOverlay.classList.remove('visible'); });

            document.addEventListener('keydown', e => { if(e.key === 'Escape') { toggleMenu(false); closeAllModals(); } });

            themeDarkSwitch.addEventListener('click', () => {
                currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
                localStorage.setItem('theme', currentTheme);
                updateUI();
            });

            function setMode(key, value) {
                if(key === 'glassMode') glassEnabled = value;
                if(key === 'liquidGlassMode') liquidGlassEnabled = value;
                if(key === 'retroMode') retroEnabled = value;
                if(key === 'bingWallpaper') bingEnabled = value;
                localStorage.setItem(key, value ? 'enabled' : 'disabled');
                if(value && key !== 'bingWallpaper') {
                    if(key !== 'glassMode') { glassEnabled = false; localStorage.setItem('glassMode','disabled'); }
                    if(key !== 'liquidGlassMode') { liquidGlassEnabled = false; localStorage.setItem('liquidGlassMode','disabled'); }
                    if(key !== 'retroMode') { retroEnabled = false; localStorage.setItem('retroMode','disabled'); }
                }
                updateUI();
            }

            glassModeSwitch.addEventListener('click', () => { const v = !glassEnabled; setMode('glassMode', v); if(v) { liquidGlassEnabled=false; localStorage.setItem('liquidGlassMode','disabled'); retroEnabled=false; localStorage.setItem('retroMode','disabled'); } updateUI(); });
            liquidGlassModeSwitch.addEventListener('click', () => { const v = !liquidGlassEnabled; setMode('liquidGlassMode', v); if(v) { glassEnabled=false; localStorage.setItem('glassMode','disabled'); retroEnabled=false; localStorage.setItem('retroMode','disabled'); } updateUI(); });
            retroModeSwitch.addEventListener('click', () => { const v = !retroEnabled; setMode('retroMode', v); if(v) { glassEnabled=false; localStorage.setItem('glassMode','disabled'); liquidGlassEnabled=false; localStorage.setItem('liquidGlassMode','disabled'); } updateUI(); });
            bingWallpaperSwitch.addEventListener('click', () => { bingEnabled = !bingEnabled; localStorage.setItem('bingWallpaper', bingEnabled?'enabled':'disabled'); updateUI(); });

            // 壁纸选择
            wallpaperBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const choice = btn.getAttribute('data-wallpaper');
                    wallpaperChoice = choice;
                    localStorage.setItem('wallpaperChoice', choice);
                    // 选择手动壁纸时关闭必应壁纸
                    bingEnabled = false;
                    localStorage.setItem('bingWallpaper', 'disabled');
                    updateUI();
                });
            });

            // 语言开关互斥
            langSwitches.forEach(sw => {
                sw.addEventListener('click', () => {
                    const lang = sw.getAttribute('data-lang');
                    if (currentLang !== lang) {
                        currentLang = lang;
                        localStorage.setItem('lang', lang);
                        htmlElement.setAttribute('lang', lang);
                        updateUI();
                    }
                });
            });

            function calcInput(value) {
                if (calcShouldResetDisplay) { calcDisplay.textContent = '0'; calcShouldResetDisplay = false; }
                const current = calcDisplay.textContent;
                if (value === '.' && current.includes('.')) return;
                if (current === '0' && value !== '.') calcDisplay.textContent = value;
                else calcDisplay.textContent = current + value;
            }
            function calcSetOperator(op) {
                const currentValue = parseFloat(calcDisplay.textContent);
                if (calcOperator && !calcShouldResetDisplay) { const result = calcCalculate(); calcDisplay.textContent = String(result); calcFirstOperand = result; }
                else calcFirstOperand = currentValue;
                calcOperator = op; calcShouldResetDisplay = true;
            }
            function calcCalculate() {
                const second = parseFloat(calcDisplay.textContent);
                let result = 0;
                switch(calcOperator) {
                    case 'add': result = calcFirstOperand + second; break;
                    case 'subtract': result = calcFirstOperand - second; break;
                    case 'multiply': result = calcFirstOperand * second; break;
                    case 'divide': result = calcFirstOperand / second; break;
                    default: result = second;
                }
                return Math.round(result * 1000000) / 1000000;
            }
            function calcEquals() {
                if (calcOperator !== null) { const result = calcCalculate(); calcDisplay.textContent = String(result); calcFirstOperand = null; calcOperator = null; calcShouldResetDisplay = true; }
            }
            function calcClear() { calcDisplay.textContent = '0'; calcFirstOperand = null; calcOperator = null; calcShouldResetDisplay = false; }
            function calcBackspace() {
                const current = calcDisplay.textContent;
                if (current.length > 1 && !calcShouldResetDisplay) calcDisplay.textContent = current.slice(0, -1);
                else { calcDisplay.textContent = '0'; calcShouldResetDisplay = false; }
            }
            function calcPercent() { calcDisplay.textContent = String(parseFloat(calcDisplay.textContent) / 100); }
            document.querySelectorAll('.calc-key').forEach(btn => {
                btn.addEventListener('click', () => {
                    const value = btn.getAttribute('data-value');
                    const action = btn.getAttribute('data-action');
                    if (value !== null) calcInput(value);
                    else if (action) {
                        switch(action) {
                            case 'clear': calcClear(); break;
                            case 'backspace': calcBackspace(); break;
                            case 'percent': calcPercent(); break;
                            case 'add': calcSetOperator('add'); break;
                            case 'subtract': calcSetOperator('subtract'); break;
                            case 'multiply': calcSetOperator('multiply'); break;
                            case 'divide': calcSetOperator('divide'); break;
                            case 'equals': calcEquals(); break;
                        }
                    }
                });
            });

            buildDialpad();
            updateUI();
        })();
    </script>
</body>
</html>
